<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Editor - Glassmorphism</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Base Reset & Background */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            /* Futuristic glowing background */
            background: radial-gradient(circle at 15% 50%, #1a0b2e, #0f0c29, #24243e);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Glassmorphism Utility Class */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }

        /* Top Navbar */
        .navbar {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            z-index: 10;
        }

        .navbar h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .btn-export {
            background: linear-gradient(45deg, #00e5ff, #0077ff);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .btn-export:hover {
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.8);
            transform: scale(1.05);
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        /* Sidebar (Tools) */
        .sidebar {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tool-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a0a0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            font-size: 12px;
            flex-direction: column;
        }

        .tool-btn:hover {
            background: rgba(0, 229, 255, 0.1);
            border-color: #00e5ff;
            color: #00e5ff;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        /* Canvas Area */
        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
        }

        /* The actual editing artboard */
        .artboard {
            width: 800px;
            height: 500px;
            background: rgba(255, 255, 255, 0.8); /* White canvas for editing */
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
        }

        /* Right Panel (Properties) */
        .properties-panel {
            width: 250px;
            padding: 20px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        .properties-panel h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            margin-bottom: 15px;
            color: #ff00ff;
            text-shadow: 0 0 5px rgba(255, 0, 255, 0.4);
        }

        .prop-group {
            margin-bottom: 15px;
        }

        .prop-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #ccc;
        }

        .prop-group input[type="range"], .prop-group input[type="color"] {
            width: 100%;
            cursor: pointer;
        }

        /* Draggable Element inside Canvas */
        .draggable-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #333;
            font-size: 24px;
            font-family: Arial, sans-serif;
            cursor: grab;
            user-select: none;
            padding: 5px;
            border: 1px dashed transparent;
        }
        
        .draggable-text:active {
            cursor: grabbing;
        }

        .draggable-text:hover {
            border-color: #00e5ff;
        }
    </style>
</head>
<body>

    <header class="navbar glass">
        <h1>NEON.CANVAS</h1>
        <button class="btn-export">Export Design</button>
    </header>

    <div class="workspace">
        
        <aside class="sidebar glass">
            <div class="tool-btn" onclick="addText()">
                <span style="font-size: 20px; font-weight: bold;">T</span>
                Text
            </div>
            <div class="tool-btn">
                <span style="font-size: 20px;">⬛</span>
                Shape
            </div>
            <div class="tool-btn">
                <span style="font-size: 20px;">🖼️</span>
                Image
            </div>
            <div class="tool-btn">
                <span style="font-size: 20px;">✨</span>
                AI
            </div>
        </aside>

        <main class="canvas-container">
            <div style="position: absolute; width: 300px; height: 300px; background: #00e5ff; filter: blur(150px); opacity: 0.2; top: 10%; left: 20%;"></div>
            <div style="position: absolute; width: 300px; height: 300px; background: #ff00ff; filter: blur(150px); opacity: 0.2; bottom: 10%; right: 20%;"></div>
            
            <div class="artboard" id="artboard">
                </div>
        </main>

        <aside class="properties-panel glass">
            <h3>PROPERTIES</h3>
            <div class="prop-group">
                <label>Opacity</label>
                <input type="range" min="0" max="100" value="100">
            </div>
            <div class="prop-group">
                <label>Blur (Glass Effect)</label>
                <input type="range" min="0" max="50" value="0">
            </div>
            <div class="prop-group">
                <label>Color</label>
                <input type="color" value="#00e5ff">
            </div>
        </aside>
    </div>

    <script>
        const artboard = document.getElementById('artboard');

        // Function to add a new text element to the canvas
        function addText() {
            const textElement = document.createElement('div');
            textElement.className = 'draggable-text';
            textElement.innerText = 'Futuristic Text';
            textElement.contentEditable = true; // Make it editable
            
            // Basic Drag and Drop Logic
            let isDragging = false;
            let startX, startY, initialX, initialY;

            textElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialX = textElement.offsetLeft;
                initialY = textElement.offsetTop;
                textElement.style.cursor = 'grabbing';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                textElement.style.left = `${initialX + dx}px`;
                textElement.style.top = `${initialY + dy}px`;
                textElement.style.transform = 'none'; // Remove center transform for dragging
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
                textElement.style.cursor = 'grab';
            });

            artboard.appendChild(textElement);
        }
    </script>
</body>
</html>
