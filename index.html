<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB Advertisers | FPV Digital Highway</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #080808; color: #fff; overflow-x: hidden; overscroll-behavior: none; }
        h1, h2, h3, .logo, .screen-count { font-family: 'Montserrat', sans-serif; text-transform: uppercase; }
        nav {
            position: fixed; top: 0; width: 100%; padding: 24px 50px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; background: linear-gradient(to bottom, rgba(8,8,8,0.9), transparent);
        }
        .logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; }
        .logo span { color: #cc0000; text-shadow: 0 0 15px rgba(204,0,0,0.8); }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
        .scroll-content { position: relative; z-index: 10; }
        .hero {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            pointer-events: none; padding: 0 5vw;
        }
        .hero h1 { font-size: 6.5vw; font-weight: 900; line-height: 1; letter-spacing: -0.02em; text-shadow: 0 10px 40px rgba(0,0,0,0.9); max-width: 90vw; }
        .hero h1 span { color: #cc0000; text-shadow: 0 0 40px rgba(204,0,0,0.6); }
        .hero p { font-size: 1.2rem; color: #ccc; margin-top: 30px; letter-spacing: 3px; font-weight: 400; text-transform: uppercase; }
        .scroll-spacer { height: 500vh; }
        .content-section {
            background-color: #080808; padding: 120px 5vw; position: relative; z-index: 20;
            border-top: 1px solid rgba(204,0,0,0.5); box-shadow: 0 -40px 80px rgba(0,0,0,1);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .section-header { text-align: center; font-size: 3.5rem; margin-bottom: 80px; font-weight: 900; letter-spacing: -1px; }
        .cards-container { display: flex; gap: 40px; max-width: 1200px; width: 100%; justify-content: center; flex-wrap: wrap; }
        .site-card {
            background: #111; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
            padding: 70px 40px; flex: 1; min-width: 320px; max-width: 500px;
            text-align: center; transition: all 0.5s cubic-bezier(0.2,0.8,0.2,1);
            position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center;
        }
        .site-card::before {
            content: ""; position: absolute; inset: 0;
            background: radial-gradient(circle at top, rgba(204,0,0,0.15), transparent 70%);
            opacity: 0; transition: 0.5s;
        }
        .site-card:hover { transform: translateY(-10px); border-color: rgba(204,0,0,0.6); box-shadow: 0 20px 50px rgba(0,0,0,1), 0 0 40px rgba(204,0,0,0.2); }
        .site-card:hover::before { opacity: 1; }
        .screen-count { font-size: 6rem; color: #cc0000; line-height: 1; margin-bottom: 5px; z-index: 2; text-shadow: 0 0 30px rgba(204,0,0,0.5); }
        .site-card p { color: #999; font-size: 1.1rem; z-index: 2; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 30px; font-weight: 500; }
        .site-card h3 { font-size: 2.2rem; z-index: 2; color: #fff; line-height: 1.2; }
    </style>
</head>
<body>
    <nav><div class="logo">KB <span>ADV</span></div></nav>
    <div id="webgl-container"></div>
    <div class="scroll-content">
        <section class="hero">
            <h1>Turning Roads Into<br><span>Digital Message</span></h1>
            <p>Scroll to begin the flight</p>
        </section>
        <div class="scroll-spacer"></div>
        <section class="content-section">
            <h2 class="section-header">Site Information</h2>
            <div class="cards-container">
                <div class="site-card">
                    <div class="screen-count">70</div>
                    <p>Screens</p>
                    <h3>Flyover<br>Gujranwala</h3>
                </div>
                <div class="site-card">
                    <div class="screen-count">35</div>
                    <p>Screens</p>
                    <h3>Sialkot Road<br>Gujranwala</h3>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2('#111111', 0.008);
        scene.background = new THREE.Color('#101010');

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.5;
        container.appendChild(renderer.domElement);

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(new THREE.RenderPass(scene, camera));
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.3);
        composer.addPass(bloomPass);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.2));
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        // Road
        const road = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 600),
            new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8, metalness: 0.2 })
        );
        road.rotation.x = -Math.PI / 2;
        road.position.set(0, -6, -150);
        scene.add(road);

        const divider = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 0.6, 600),
            new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 })
        );
        divider.position.set(0, -5.7, -150);
        scene.add(divider);

        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        const lineGeo = new THREE.PlaneGeometry(0.15, 600);
        [-0.8, 0.8].forEach(x => {
            const l = new THREE.Mesh(lineGeo, lineMat);
            l.rotation.x = -Math.PI / 2;
            l.position.set(x, -5.98, -150);
            scene.add(l);
        });

        // Particles
        const pGeo = new THREE.BufferGeometry();
        const pArr = new Float32Array(1500 * 3);
        for (let i = 0; i < 1500 * 3; i++) pArr[i] = (Math.random() - 0.5) * 80;
        pGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
        const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
            size: 0.05, color: 0xcc0000, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending
        }));
        scene.add(particles);

        // Billboard materials
        const textureLoader = new THREE.TextureLoader();
        const screenMat = new THREE.MeshStandardMaterial({
            color: 0x111111, emissive: 0x555555, roughness: 0.1, metalness: 0.9
        });
        textureLoader.load('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=512&h=1024&auto=format&fit=crop', (tex) => {
            tex.generateMipmaps = true;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            screenMat.map = tex;
            screenMat.emissiveMap = tex;
            screenMat.emissiveIntensity = 2.0;
            screenMat.color.setHex(0xffffff);
            screenMat.needsUpdate = true;
        });
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.9, roughness: 0.2 });

        const smdGeo = new THREE.BoxGeometry(3, 6, 0.3);
        const poleGeo = new THREE.CylinderGeometry(0.25, 0.35, 14);
        const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 4);
        const smdMats = [bodyMat, bodyMat, bodyMat, bodyMat, screenMat, bodyMat];

        const smdCount = 4;
        const zSpacing = 50;
        const totalDepth = smdCount * zSpacing;

        for (let i = 0; i < smdCount; i++) {
            const zPos = -(i * zSpacing) - 20;
            [{ x: -10.5, left: true }, { x: 10.5, left: false }].forEach(({ x, left }) => {
                const g = new THREE.Group();
                g.position.set(x, 0, zPos);

                const pole = new THREE.Mesh(poleGeo, poleMat);
                pole.position.set(0, 1, -0.4);
                g.add(pole);

                const screen = new THREE.Mesh(smdGeo, smdMats);
                screen.position.set(0, 1.5, 0);
                screen.rotation.y = left ? Math.PI / 10 : -Math.PI / 10;
                g.add(screen);

                const spot = new THREE.SpotLight(0xffffff, 2.0, 25, Math.PI / 5, 0.5, 1);
                spot.position.set(0, -3, 4);
                spot.target = screen;
                g.add(spot);

                const glow = new THREE.PointLight(0xcc0000, 1.0, 20);
                glow.position.set(left ? 1 : -1, 1.5, 2);
                g.add(glow);

                const aDir = left ? 1 : -1;
                const arm = new THREE.Mesh(armGeo, poleMat);
                arm.rotation.z = Math.PI / 2;
                arm.position.set(aDir * 2, 7.8, -0.4);
                g.add(arm);

                const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                bulb.position.set(aDir * 3.8, 7.7, -0.4);
                g.add(bulb);

                const sl = new THREE.SpotLight(0xffeedd, 1.0, 50, Math.PI / 4, 0.6, 2);
                sl.position.set(aDir * 3.8, 7.7, -0.4);
                const tgt = new THREE.Object3D();
                tgt.position.set(aDir * 5, -6, 0);
                g.add(tgt);
                sl.target = tgt;
                g.add(sl);

                scene.add(g);
            });
        }

        // Camera motion:
        // Phase 1 (0.00 → 0.25): Bird's eye, high altitude, looking down
        // Phase 2 (0.25 → 0.55): Smooth descent to eye-level
        // Phase 3 (0.55 → 1.00): Eye-level forward flight, gentle cinematic drift

        const START_Y  = 80;
        const EYE_Y    = -1;
        const START_Z  = 5;
        const END_Z    = -(totalDepth - 10);

        gsap.registerPlugin(ScrollTrigger);
        const scrollData = { progress: 0 };

        gsap.to(scrollData, {
            progress: 1,
            ease: "none",
            scrollTrigger: {
                trigger: ".scroll-spacer",
                start: "top top",
                end: "bottom bottom",
                scrub: 2.5
            }
        });

        gsap.to(".hero", {
            opacity: 0, y: -50,
            scrollTrigger: {
                trigger: ".scroll-spacer",
                start: "top top", end: "8% top", scrub: true
            }
        });

        gsap.from(".site-card", {
            scrollTrigger: { trigger: ".content-section", start: "top 75%" },
            y: 80, opacity: 0, duration: 1, stagger: 0.2, ease: "power3.out"
        });

        camera.position.set(0, START_Y, START_Z);
        camera.lookAt(0, 0, -20);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            particles.rotation.y = t * 0.04;

            const p = scrollData.progress;

            if (p <= 0.25) {
                // Phase 1: Bird's eye
                const phaseP = p / 0.25;
                camera.position.x = 0;
                camera.position.y = THREE.MathUtils.lerp(START_Y, START_Y * 0.6, phaseP);
                camera.position.z = THREE.MathUtils.lerp(START_Z, START_Z - 5, phaseP);
                camera.lookAt(0, 0, THREE.MathUtils.lerp(-10, -30, phaseP));
                camera.rotation.z = 0;
            }
            else if (p <= 0.55) {
                // Phase 2: Descent
                const phaseP = (p - 0.25) / 0.30;
                const eased = 1 - Math.pow(1 - phaseP, 3);
                camera.position.x = 0;
                camera.position.y = THREE.MathUtils.lerp(START_Y * 0.6, EYE_Y, eased);
                camera.position.z = THREE.MathUtils.lerp(START_Z - 5, START_Z - 15, eased);
                camera.lookAt(0, THREE.MathUtils.lerp(-5, EYE_Y, eased), THREE.MathUtils.lerp(-30, camera.position.z - 20, eased));
                camera.rotation.z = 0;
            }
            else {
                // Phase 3: Eye-level forward flight
                const phaseP = (p - 0.55) / 0.45;
                camera.position.z = THREE.MathUtils.lerp(START_Z - 15, END_Z, phaseP);
                camera.position.y = EYE_Y + Math.sin(phaseP * Math.PI * 2) * 0.3;
                camera.position.x = Math.sin(phaseP * Math.PI * 1.5) * 1.5;
                camera.lookAt(camera.position.x * 0.2, EYE_Y, camera.position.z - 20);
                camera.rotation.z = Math.sin(phaseP * Math.PI * 1.5) * -0.03;
            }

            composer.render();
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
