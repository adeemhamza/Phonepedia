<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeDow | Unified Media Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 2026 Futuristic Background & Typography */
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap');
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Deep neon gradient background */
            background: linear-gradient(135deg, #050505 0%, #0a0f24 50%, #1a0b2e 100%);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ambient floating orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }
        .orb-1 { width: 300px; height: 300px; background: rgba(0, 242, 254, 0.3); top: 10%; left: 20%; }
        .orb-2 { width: 400px; height: 400px; background: rgba(255, 42, 133, 0.2); bottom: 10%; right: 10%; }

        /* The Core Glassmorphism Interface */
        .glass-panel {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Neon Input Field */
        .neon-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .neon-input:focus {
            outline: none;
            border-color: #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            background: rgba(0, 0, 0, 0.6);
        }

        /* Futuristic Button */
        .btn-extract {
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }
        .btn-extract:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.6);
        }

        /* Loading Animation */
        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00f2fe;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-panel w-full max-w-3xl mx-4 p-12 text-center">
        <h1 class="text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-blue-500 tracking-tighter mb-2">
            DeDow
        </h1>
        <p class="text-gray-400 text-sm tracking-[0.3em] uppercase mb-10">Universal Media Engine 2026</p>

        <div class="relative group max-w-2xl mx-auto">
            <input type="text" id="urlInput" placeholder="Paste YouTube link or Image URL here..." 
                   class="w-full py-5 pl-6 pr-40 rounded-2xl neon-input text-lg placeholder-gray-500">
            
            <button onclick="processDownload()" id="downloadBtn"
                    class="absolute right-2 top-2 bottom-2 btn-extract px-8 rounded-xl font-bold text-sm tracking-wide flex items-center justify-center gap-2">
                <span id="btnText">EXTRACT</span>
                <div class="loader" id="spinner"></div>
            </button>
        </div>

        <div id="optionsPanel" class="mt-8 flex justify-center gap-4 opacity-50 pointer-events-none transition-opacity duration-300">
            <label class="flex items-center gap-2 text-gray-300 cursor-pointer">
                <input type="radio" name="format" value="video" checked class="accent-cyan-400">
                High Quality Video
            </label>
            <label class="flex items-center gap-2 text-gray-300 cursor-pointer">
                <input type="radio" name="format" value="audio" class="accent-cyan-400">
                Audio Only
            </label>
            <label class="flex items-center gap-2 text-gray-300 cursor-pointer">
                <input type="radio" name="format" value="image" class="accent-cyan-400">
                HD Image Preview
            </label>
        </div>

        <p id="statusMessage" class="mt-6 text-sm text-cyan-400 h-5"></p>
    </div>

    <script>
        // Simple UI Interaction Logic
        const urlInput = document.getElementById('urlInput');
        const optionsPanel = document.getElementById('optionsPanel');

        // Highlight options when user types
        urlInput.addEventListener('input', () => {
            if(urlInput.value.length > 5) {
                optionsPanel.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                optionsPanel.classList.add('opacity-50', 'pointer-events-none');
            }
        });

        function processDownload() {
            const url = urlInput.value;
            if (!url) {
                showStatus('Please enter a valid URL first.', 'text-red-400');
                return;
            }

            // UI Loading State
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            showStatus('Establishing secure connection...', 'text-cyan-400');

            // Simulated Backend Request (Since GitHub Pages is frontend only)
            setTimeout(() => {
                btnText.style.display = 'block';
                spinner.style.display = 'none';
                showStatus('Backend Server Required for Extraction. UI is ready!', 'text-yellow-400');
                
                // Note: To make this actually work, you would use fetch() here 
                // to send the 'url' to your own Python/Node.js server API.
            }, 2500);
        }

        function showStatus(message, colorClass) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = `mt-6 text-sm h-5 transition-colors ${colorClass}`;
            statusEl.innerText = message;
        }
    </script>
</body>
</html>
