<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 3D Anatomy Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; display: flex; }
        #sidebar { width: 250px; height: 100vh; background: #111; padding: 20px; border-right: 1px solid #333; z-index: 10; }
        #canvas-container { flex-grow: 1; height: 100vh; position: relative; }
        #info-panel { position: absolute; bottom: 20px; right: 20px; width: 250px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 15px; border-radius: 10px; display: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>iPhone Parts</h2>
    <p style="font-size: 12px; color: #888;">1. Click phone to Explode<br>2. Click parts for Info</p>
    <hr>
    <div id="status" style="color: #007aff;">Engine Ready ✅</div>
</div>

<div id="canvas-container">
    <div id="info-panel">
        <h3 id="p-name" style="margin:0; color:#007aff;">Part</h3>
        <p id="p-desc" style="font-size:13px;"></p>
    </div>
</div>

<script>
    let scene, camera, renderer, controls, group;
    let isExploded = false;

    const details = {
        "Screen": "Super Retina XDR OLED Display.",
        "Battery": "High-capacity Li-ion Power Cell.",
        "LogicBoard": "A17 Bionic Motherboard Layer.",
        "Camera": "Triple Lens Optical System."
    };

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        camera = new THREE.PerspectiveCamera(50, (window.innerWidth - 250) / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 10); // Camera door rakha hai taake sab dikhay

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth - 250, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lights (Very Important)
        const light1 = new THREE.DirectionalLight(0xffffff, 1.5);
        light1.position.set(5, 5, 5);
        scene.add(light1);

        const light2 = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(light2);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        
        group = new THREE.Group();
        scene.add(group);

        // Creating Parts
        const parts = [
            { name: "Screen", color: 0x333333, h: 5, w: 2.5, d: 0.1, z: 0.5 },
            { name: "LogicBoard", color: 0x00ff44, h: 3, w: 1, d: 0.1, z: 0 },
            { name: "Battery", color: 0x222222, h: 4, w: 1.5, d: 0.2, z: -0.5 },
            { name: "Camera", color: 0xffffff, h: 1, w: 1, d: 0.3, z: -0.8 }
        ];

        parts.forEach(p => {
            const geometry = new THREE.BoxGeometry(p.w, p.h, p.d);
            const material = new THREE.MeshStandardMaterial({ color: p.color, metalness: 0.5, roughness: 0.2 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.name = p.name;
            group.add(mesh);
        });

        animate();
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('mousedown', (e) => {
        if(e.clientX < 250) return;
        mouse.x = ((e.clientX - 250) / (window.innerWidth - 250)) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(group.children);

        if (hits.length > 0) {
            if (!isExploded) {
                group.children.forEach((m, i) => {
                    gsap.to(m.position, { z: i * 1.5, duration: 1 });
                });
                isExploded = true;
            } else {
                const p = hits[0].object;
                document.getElementById('info-panel').style.display = 'block';
                document.getElementById('p-name').innerText = p.name;
                document.getElementById('p-desc').innerText = details[p.name];
            }
        } else {
            if(isExploded) {
                group.children.forEach(m => gsap.to(m.position, { z: 0, duration: 1 }));
                isExploded = false;
                document.getElementById('info-panel').style.display = 'none';
            }
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        group.rotation.y += 0.005; // Model rotate hoga taake nazar aaye
        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
