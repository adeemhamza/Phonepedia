<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PROJECT: REDLINE - Pro Drift</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; }

        /* CINEMATIC HUD */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.8) 100%); /* Vignette */
        }

        .hud-panel {
            position: absolute; bottom: 30px; right: 40px;
            text-align: right;
            transform: skewX(-15deg);
        }

        #speed-val {
            font-size: 100px; font-weight: 900; color: #fff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            line-height: 0.8;
        }
        #speed-unit { font-size: 20px; color: #00ffff; letter-spacing: 2px; }

        .rpm-container {
            width: 300px; height: 15px; background: #222;
            margin-top: 10px; border: 2px solid #555;
            display: flex;
        }
        .rpm-bar { height: 100%; width: 0%; transition: width 0.05s; }

        /* CHECKPOINT TIMER */
        .timer-box {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            text-align: center; color: white;
        }
        #timer { font-size: 40px; color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        #checkpoint-msg { 
            font-size: 24px; color: #00ff00; opacity: 0; 
            transition: opacity 0.5s; text-transform: uppercase;
        }

        /* INSTRUCTIONS */
        .controls {
            position: absolute; top: 20px; left: 20px;
            color: rgba(255,255,255,0.5); font-size: 12px;
        }

    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>

    <div id="ui-layer">
        <div class="controls">WASD: Drive | SPACE: Drift | C: Camera</div>
        
        <div class="timer-box">
            <div id="timer">00:00:00</div>
            <div id="checkpoint-msg">CHECKPOINT!</div>
        </div>

        <div class="hud-panel">
            <div><span id="speed-val">0</span> <span id="speed-unit">KMH</span></div>
            <div class="rpm-container">
                <div id="rpm-fill" class="rpm-bar" style="background: linear-gradient(90deg, #00ffff, #0000ff);"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { Reflector } from 'three/addons/objects/Reflector.js'; // For mirrors if needed
        import * as CANNON from 'cannon-es';

        // --- GRAPHICS SETTINGS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x101015);
        scene.fog = new THREE.FogExp2(0x101015, 0.002);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; // Cinematic Colors
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // --- PHYSICS WORLD ---
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        world.broadphase = new CANNON.SAPBroadphase(world);

        const defaultMaterial = new CANNON.Material('default');
        const wheelMaterial = new CANNON.Material('wheel');
        const wheelGroundContact = new CANNON.ContactMaterial(wheelMaterial, defaultMaterial, {
            friction: 0.3, restitution: 0, contactEquationStiffness: 1000
        });
        world.addContactMaterial(wheelGroundContact);

        // --- TEXTURE GENERATOR (Procedural Assets) ---
        function createAsphaltTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Base Noise
            ctx.fillStyle = '#222';
            ctx.fillRect(0,0,512,512);
            for(let i=0; i<50000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#333' : '#111';
                ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
            }
            // Grid Lines
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0; i<=512; i+=64) {
                ctx.moveTo(i, 0); ctx.lineTo(i, 512);
                ctx.moveTo(0, i); ctx.lineTo(512, i);
            }
            ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(50, 50);
            return tex;
        }

        // --- ENVIRONMENT ---
        // 1. Lighting (Sunset Vibe)
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffaa33, 3);
        sunLight.position.set(-50, 100, -50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096; // High Res Shadows
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 500;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        scene.add(sunLight);

        // 2. The Floor
        const floorGeo = new THREE.PlaneGeometry(1000, 1000);
        const floorMat = new THREE.MeshStandardMaterial({ 
            map: createAsphaltTexture(),
            roughness: 0.8,
            metalness: 0.1
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const floorBody = new CANNON.Body({ mass: 0, material: defaultMaterial });
        floorBody.addShape(new CANNON.Plane());
        floorBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
        world.addBody(floorBody);

        // 3. Neon Checkpoints
        const checkpoints = [];
        function createCheckpoint(x, z, i) {
            const geo = new THREE.TorusGeometry(8, 0.5, 16, 100);
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 4, z);
            mesh.lookAt(x + 10, 4, z + 10); // Random rotation logic could be better
            scene.add(mesh);
            checkpoints.push({ mesh, active: true, id: i, pos: new THREE.Vector3(x,0,z) });

            // Light column
            const light = new THREE.PointLight(0x00ff00, 5, 20);
            light.position.set(x, 5, z);
            scene.add(light);
        }

        // Generate circular track checkpoints
        for(let i=0; i<10; i++) {
            const angle = (i / 10) * Math.PI * 2;
            const r = 150;
            createCheckpoint(Math.cos(angle)*r, Math.sin(angle)*r, i);
        }

        // --- THE PRO CAR (Detailed Geometry) ---
        function createProCar() {
            const chassisShape = new CANNON.Box(new CANNON.Vec3(1, 0.4, 2.0));
            const chassisBody = new CANNON.Body({ mass: 150 });
            chassisBody.addShape(chassisShape, new CANNON.Vec3(0, -0.2, 0));
            chassisBody.position.set(150, 2, 0); // Start at first checkpoint roughly
            chassisBody.angularDamping = 0.5;

            // Visuals
            const carGroup = new THREE.Group();

            // Car Paint Material (Shiny)
            const paintMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff, // White
                metalness: 0.6,
                roughness: 0.2,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1
            });
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0x111111, metalness: 0.9, roughness: 0.0, transparent: true, opacity: 0.7
            });
            const carbonMat = new THREE.MeshStandardMaterial({
                color: 0x111111, roughness: 0.8
            });

            // Main Hull
            const hullGeo = new THREE.BoxGeometry(2.0, 0.6, 4.2);
            const hull = new THREE.Mesh(hullGeo, paintMat);
            hull.position.y = 0;
            hull.castShadow = true;
            carGroup.add(hull);

            // Cabin
            const cabinGeo = new THREE.BoxGeometry(1.8, 0.5, 2.2);
            const cabin = new THREE.Mesh(cabinGeo, glassMat);
            cabin.position.set(0, 0.6, -0.2);
            carGroup.add(cabin);

            // Spoiler
            const spoilerLegs = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 0.1), carbonMat);
            spoilerLegs.position.set(0, 0.5, -1.8);
            carGroup.add(spoilerLegs);
            const spoilerWing = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 0.6), carbonMat);
            spoilerWing.position.set(0, 0.8, -1.9);
            carGroup.add(spoilerWing);

            // Glowing Tail Lights (Neon Trail)
            const tailGeo = new THREE.BoxGeometry(0.8, 0.2, 0.1);
            const tailMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const tl = new THREE.Mesh(tailGeo, tailMat); tl.position.set(0.5, 0.1, -2.11);
            const tr = new THREE.Mesh(tailGeo, tailMat); tr.position.set(-0.5, 0.1, -2.11);
            carGroup.add(tl); carGroup.add(tr);

            // Light Stream
            const tailLightObj = new THREE.PointLight(0xff0000, 2, 10);
            tailLightObj.position.set(0, 0.5, -2.5);
            carGroup.add(tailLightObj);

            // Headlights
            const headLightObj = new THREE.SpotLight(0xffffff, 100);
            headLightObj.position.set(0, 0.5, 2.0);
            headLightObj.target.position.set(0, 0, 10);
            headLightObj.angle = 0.5;
            headLightObj.penumbra = 0.5;
            headLightObj.castShadow = true;
            carGroup.add(headLightObj);
            carGroup.add(headLightObj.target);

            scene.add(carGroup);

            // Wheels
            const vehicle = new CANNON.RaycastVehicle({
                chassisBody: chassisBody,
                indexRightAxis: 0, indexUpAxis: 1, indexForwardAxis: 2
            });

            const wheelOptions = {
                radius: 0.35, directionLocal: new CANNON.Vec3(0, -1, 0),
                suspensionStiffness: 50, suspensionRestLength: 0.3,
                frictionSlip: 2.5, dampingRelaxation: 2.3, dampingCompression: 4.4,
                maxSuspensionForce: 100000, rollInfluence: 0.01,
                axleLocal: new CANNON.Vec3(1, 0, 0),
                chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 0),
                maxSuspensionTravel: 0.2,
                customSlidingRotationalSpeed: -30, useCustomSlidingRotationalSpeed: true
            };

            vehicle.addWheel({ ...wheelOptions, chassisConnectionPointLocal: new CANNON.Vec3(0.9, -0.2, 1.4) });
            vehicle.addWheel({ ...wheelOptions, chassisConnectionPointLocal: new CANNON.Vec3(-0.9, -0.2, 1.4) });
            vehicle.addWheel({ ...wheelOptions, chassisConnectionPointLocal: new CANNON.Vec3(0.9, -0.2, -1.4) });
            vehicle.addWheel({ ...wheelOptions, chassisConnectionPointLocal: new CANNON.Vec3(-0.9, -0.2, -1.4) });

            vehicle.addToWorld(world);

            const wheelMeshes = [];
            const wGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.35, 32);
            const wMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
            const rimGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.36, 16);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, metalness: 1.0, roughness: 0.2 });

            for(let i=0; i<4; i++){
                const grp = new THREE.Group();
                const t = new THREE.Mesh(wGeo, wMat); t.rotation.z = Math.PI/2;
                const r = new THREE.Mesh(rimGeo, rimMat); r.rotation.z = Math.PI/2;
                grp.add(t); grp.add(r);
                scene.add(grp);
                wheelMeshes.push(grp);
            }

            return { vehicle, chassisBody, carGroup, wheelMeshes };
        }

        const { vehicle, chassisBody, carGroup, wheelMeshes } = createProCar();

        // --- GAME LOGIC ---
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let camMode = 0;
        let startTime = Date.now();

        document.addEventListener('keydown', (e) => {
            if(e.code === 'Space') keys.space = true;
            if(e.key.toLowerCase() === 'c') camMode = (camMode + 1) % 2;
            keys[e.key.toLowerCase()] = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'Space') keys.space = false;
            keys[e.key.toLowerCase()] = false;
        });

        // Loop
        function animate() {
            requestAnimationFrame(animate);
            world.step(1/60);

            // Driving Physics
            const speed = chassisBody.velocity.length();
            const kmh = Math.round(speed * 3.6);
            const engineForce = 2000;
            const maxSteer = 0.5 - (speed * 0.01); // Dynamic steering (less steer at high speed)

            let force = 0;
            if(keys.w) force = -engineForce;
            if(keys.s) force = engineForce;
            vehicle.applyEngineForce(force, 2);
            vehicle.applyEngineForce(force, 3);

            let steer = 0;
            if(keys.a) steer = maxSteer;
            if(keys.d) steer = -maxSteer;
            vehicle.setSteeringValue(steer, 0);
            vehicle.setSteeringValue(steer, 1);

            if(keys.space) {
                vehicle.setBrake(100, 2); vehicle.setBrake(100, 3);
            } else {
                vehicle.setBrake(0, 2); vehicle.setBrake(0, 3);
            }

            // Visual Sync
            carGroup.position.copy(chassisBody.position);
            carGroup.quaternion.copy(chassisBody.quaternion);
            carGroup.translateY(-0.6); // Suspension offset

            for(let i=0; i<4; i++){
                vehicle.updateWheelTransform(i);
                wheelMeshes[i].position.copy(vehicle.wheelInfos[i].worldTransform.position);
                wheelMeshes[i].quaternion.copy(vehicle.wheelInfos[i].worldTransform.quaternion);
            }

            // Camera System (with Shake)
            const shake = Math.random() * (speed * 0.002);
            let camOffset = camMode === 0 ? new THREE.Vector3(0, 5, 10) : new THREE.Vector3(0, 2, 0.5);
            let targetPos = camOffset.applyMatrix4(carGroup.matrixWorld);
            
            camera.position.lerp(targetPos, 0.1);
            camera.position.x += shake;
            camera.position.y += shake;
            camera.lookAt(carGroup.position);

            // Update UI
            document.getElementById('speed-val').innerText = kmh;
            const rpm = Math.min((kmh / 200) * 100, 100);
            const rpmBar = document.getElementById('rpm-fill');
            rpmBar.style.width = rpm + '%';
            rpmBar.style.background = rpm > 90 ? 'red' : 'linear-gradient(90deg, #00ffff, #0000ff)';

            // Timer
            const elapsed = Date.now() - startTime;
            const min = Math.floor(elapsed / 60000);
            const sec = Math.floor((elapsed % 60000) / 1000);
            const ms = Math.floor((elapsed % 1000) / 10);
            document.getElementById('timer').innerText = `${min}:${sec}:${ms}`;

            // Checkpoint Logic
            checkpoints.forEach(cp => {
                if(!cp.active) return;
                const dist = carGroup.position.distanceTo(cp.pos);
                if(dist < 10) {
                    cp.active = false;
                    cp.mesh.material.color.setHex(0x555555); // Turn off
                    const msg = document.getElementById('checkpoint-msg');
                    msg.style.opacity = 1;
                    setTimeout(() => msg.style.opacity = 0, 1000);
                }
                cp.mesh.rotation.y += 0.02; // Animate ring
            });

            renderer.render(scene, camera);
        }

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
