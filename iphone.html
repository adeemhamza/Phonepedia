<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 1 to 17 Pro Max - Split View</title>
    <style>
        /* --- Apple Aesthetic Theme --- */
        :root {
            --bg-color: #f5f5f7;
            --sidebar-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-light: #86868b;
            --accent: #0071e3;
            --border: #d2d2d7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 1. Sidebar (Navigation) --- */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            padding: 20px 0;
        }

        .sidebar-title {
            padding: 0 20px 15px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            border-left: 3px solid transparent;
            display: flex;
            justify-content: space-between;
        }

        .nav-item:hover { background-color: #f2f2f2; }
        
        .nav-item.active {
            background-color: #e8f2ff;
            color: var(--accent);
            border-left: 3px solid var(--accent);
            font-weight: 600;
        }

        /* --- 2. Main Content Area (Split View) --- */
        .main-content {
            flex: 1;
            display: flex; /* Flexbox for Left Image / Right Table */
            overflow: hidden;
            background: #fff;
        }

        /* Left Side: Image */
        .phone-display {
            flex: 0.8; /* 40% width approx */
            background-color: #fbfbfd;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid var(--border);
            padding: 40px;
            position: relative;
        }

        .phone-img {
            max-height: 70vh;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.2));
            animation: floatIn 0.6s ease-out;
        }

        .phone-header-text {
            margin-top: 30px;
            text-align: center;
        }
        
        .phone-title { font-size: 32px; font-weight: 700; margin-bottom: 5px; }
        .phone-tagline { font-size: 16px; color: var(--text-light); font-style: italic; }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Right Side: Table Details */
        .specs-container {
            flex: 1.2; /* 60% width approx */
            overflow-y: auto;
            padding: 40px 50px;
        }

        .specs-header {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        /* --- Apple Style Table --- */
        .specs-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        .specs-table th {
            text-align: left;
            padding: 16px 10px;
            color: var(--text-light);
            font-weight: 600;
            width: 35%;
            border-bottom: 1px solid #e5e5e5;
        }

        .specs-table td {
            padding: 16px 10px;
            color: var(--text-main);
            font-weight: 500;
            border-bottom: 1px solid #e5e5e5;
            line-height: 1.5;
        }

        .specs-table tr:last-child th, 
        .specs-table tr:last-child td {
            border-bottom: none;
        }

        /* Mobile Responsive */
        @media (max-width: 900px) {
            .sidebar { display: none; } /* Hide sidebar on mobile for focus */
            .main-content { flex-direction: column; overflow-y: auto; }
            .phone-display { flex: none; height: 400px; border-right: none; border-bottom: 1px solid var(--border); }
            .specs-container { flex: none; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-title">Select Model</div>
        </div>

    <div class="main-content">
        
        <div class="phone-display">
            <img id="display-img" src="" alt="iPhone" class="phone-img">
            <div class="phone-header-text">
                <div id="display-title" class="phone-title">iPhone</div>
                <div id="display-tag" class="phone-tagline">Loading...</div>
            </div>
        </div>

        <div class="specs-container">
            <div class="specs-header">Technical Specifications</div>
            <table class="specs-table">
                <tbody id="specs-body">
                    </tbody>
            </table>
        </div>

              specs: { "Release Year": "2022", "Chipset": "Apple A16 Bionic", "RAM": "6 GB", "Display": "Dynamic Island, Always-On", "Rear Camera": "48 MP Main Sensor", "Safety": "Crash Detection, Satellite SOS", "Battery": "4323 mAh" } },

            { name: "iPhone 15 Pro Max", year: "2023", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/IPhone_15_Pro_Blue_Titanium_mock.png/440px-IPhone_15_Pro_Blue_Titanium_mock.png", tag: "Titanium.", 
              specs: { "Release Year": "2023", "Chipset": "Apple A17 Pro (3nm)", "RAM": "8 GB", "Build": "Titanium Frame", "Port": "USB-C (USB 3)", "Rear Camera": "48 MP (5x Optical Zoom)", "Action Button": "Yes", "Gaming": "Ray Tracing Support" } },

            { name: "iPhone 16 Pro Max", year: "2024", img: "https://fdn2.gsmarena.com/vv/bigpic/apple-iphone-16-pro-max.jpg", tag: "Built for Intelligence.", 
              specs: { "Release Year": "2024", "Chipset": "Apple A18 Pro", "RAM": "8 GB", "Display": "6.9 inch Borderless", "AI": "Apple Intelligence Built-in", "Camera Control": "Dedicated Capacitive Button", "Rear Camera": "48MP Ultra-wide", "Battery": "4685 mAh" } },

            { name: "iPhone 17 Pro Max", year: "2025 (Rumored)", img: "https://via.placeholder.com/350x650/000000/FFFFFF?text=iPhone+17+Pro+Max", tag: "The Future of Vision.", 
              specs: { "Release Year": "2025 (Expected)", "Chipset": "Apple A19 Pro (2nm)", "RAM": "12 GB LPDDR6", "Display": "6.9\" Micro-LED ProMotion", "Front Camera": "24 MP", "Rear Camera": "Triple 48 MP System", "Security": "Under-Display Face ID", "Battery": "5000 mAh Stacked", "Cooling": "Vapor Chamber" } }
        ];

        const sidebar = document.getElementById('sidebar');
        const specsBody = document.getElementById('specs-body');
        const displayImg = document.getElementById('display-img');
        const displayTitle = document.getElementById('display-title');
        const displayTag = document.getElementById('display-tag');

        // Populate Sidebar
        phones.forEach((phone, index) => {
            const btn = document.createElement('div');
            btn.className = 'nav-item';
            btn.innerHTML = `<span>${phone.name}</span> <span style="font-size:12px; opacity:0.6;">${phone.year}</span>`;
            btn.onclick = () => loadPhone(index, btn);
            sidebar.appendChild(btn);
        });

        // Function to Load Data
        function loadPhone(index, clickedBtn) {
            // Active Class Toggle
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            if(clickedBtn) clickedBtn.classList.add('active');

            const data = phones[index];

            // 1. Update Image Section
            displayImg.src = data.img;
            displayTitle.innerText = data.name;
            displayTag.innerText = data.tag;

            // Image Animation Reset
            displayImg.style.animation = 'none';
            displayImg.offsetHeight; /* Trigger Reflow */
            displayImg.style.animation = 'floatIn 0.6s ease-out';

            // 2. Update Table (Dynamic Rows)
            specsBody.innerHTML = ''; // Clear old data
            
            for (const [key, value] of Object.entries(data.specs)) {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <th>${key}</th>
                    <td>${value}</td>
                `;
                specsBody.appendChild(row);
            }
        }

        // Initialize with Latest Phone
        const lastIndex = phones.length - 1;
        loadPhone(lastIndex, sidebar.children[lastIndex + 1]); // +1 to skip title

    </script>
</body>
</html>
