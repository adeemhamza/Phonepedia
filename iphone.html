<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Interactive Anatomy</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>

    <style>
        :root { --primary: #007aff; --bg: #000000; --panel: rgba(20, 20, 20, 0.85); }
        body { margin: 0; background: var(--bg); color: white; font-family: 'SF Pro Display', -apple-system, sans-serif; display: flex; overflow: hidden; }

        /* Sidebar */
        #sidebar {
            width: 280px; height: 100vh; background: #0a0a0a; border-right: 1px solid #333;
            padding: 30px 20px; z-index: 100; box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        h2 { font-weight: 600; font-size: 22px; margin-bottom: 30px; letter-spacing: -0.5px; }
        .model-item {
            padding: 16px; margin-bottom: 12px; background: #1c1c1e; border-radius: 12px;
            cursor: pointer; transition: all 0.3s ease; border: 1px solid transparent;
        }
        .model-item:hover { background: #2c2c2e; border-color: var(--primary); transform: translateY(-2px); }
        .model-item.active { background: var(--primary); }

        /* Detail Panel */
        #info-panel {
            position: absolute; bottom: 40px; right: 40px; width: 320px;
            background: var(--panel); backdrop-filter: blur(20px); padding: 25px;
            border-radius: 20px; border: 1px solid #444; display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); animation: slideIn 0.5s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        #info-panel h3 { margin-top: 0; color: var(--primary); font-size: 20px; }
        #info-panel p { line-height: 1.6; color: #ccc; font-size: 14px; }

        /* Canvas */
        #canvas-container { flex-grow: 1; position: relative; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }

        /* Instructions */
        .hint { position: absolute; bottom: 20px; left: 300px; color: #666; font-size: 12px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>iPhone Explorer</h2>
    <div class="model-item" onclick="loadiPhone('iphone15')">iPhone 15 Pro Max</div>
    <div class="model-item" onclick="loadiPhone('iphone14')">iPhone 14 Pro</div>
    <div class="model-item" onclick="loadiPhone('iphone13')">iPhone 13</div>
</div>

<div id="info-panel">
    <h3 id="part-name">Component Name</h3>
    <p id="part-detail">Click on an internal part to see its technical specifications.</p>
</div>

<div id="canvas-container">
    <div class="hint">Scroll to Zoom • Drag to Rotate • Click Parts to Inspect</div>
</div>

<script>
    let scene, camera, renderer, controls, modelGroup;
    let isExploded = false;

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        camera = new THREE.PerspectiveCamera(45, (window.innerWidth - 280) / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 10);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth - 280, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Professional Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(5, 10, 7.5);
        scene.add(mainLight);

        // Orbit Controls (Mouse Movement)
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        modelGroup = new THREE.Group();
        scene.add(modelGroup);

        animate();
    }

    // Professional Part Data
    const partData = {
        'Screen': 'OLED Super Retina XDR display with ProMotion technology.',
        'Battery': 'High-density Lithium-ion battery for all-day performance.',
        'Chip': 'A17 Bionic: The fastest chip ever in a smartphone.',
        'Camera': '48MP Main camera with advanced computational photography.'
    };

    function loadiPhone(type) {
        // Clear previous model
        while(modelGroup.children.length > 0) modelGroup.remove(modelGroup.children[0]);
        isExploded = false;
        document.getElementById('info-panel').style.display = 'none';

        // NOTE: In a real app, you will use GLTFLoader here
        // For this demo, we create high-quality placeholders that represent layers
        const layers = [
            { name: 'Screen', color: 0x111111, size: [2.5, 5, 0.1], z: 0.5 },
            { name: 'Chip', color: 0x333333, size: [1, 1, 0.2], z: 0.2 },
            { name: 'Battery', color: 0x222222, size: [1.8, 3.5, 0.15], z: 0 },
            { name: 'Camera', color: 0x444444, size: [0.8, 0.8, 0.3], z: -0.2 }
        ];

        layers.forEach(layer => {
            const geometry = new THREE.BoxGeometry(...layer.size);
            const material = new THREE.MeshStandardMaterial({ 
                color: layer.color, 
                metalness: 0.8, 
                roughness: 0.2 
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.name = layer.name;
            mesh.userData = { detail: partData[layer.name] };
            modelGroup.add(mesh);
        });
    }

    // Raycaster for Interaction
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
        if (event.clientX < 280) return; // Ignore sidebar clicks

        mouse.x = ((event.clientX - 280) / (window.innerWidth - 280)) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(modelGroup.children);

        if (intersects.length > 0) {
            const part = intersects[0].object;
            
            if (!isExploded) {
                // Explode Animation
                modelGroup.children.forEach((m, i) => {
                    gsap.to(m.position, { z: i * 1.2, duration: 1.2, ease: "expo.out" });
                });
                isExploded = true;
            } else {
                // Show Detail
                const panel = document.getElementById('info-panel');
                panel.style.display = 'block';
                document.getElementById('part-name').innerText = part.name;
                document.getElementById('part-detail').innerText = part.userData.detail;
            }
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = (window.innerWidth - 280) / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth - 280, window.innerHeight);
    });

    init();
    loadiPhone('iphone15');
</script>
</body>
</html>
