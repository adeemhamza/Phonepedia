<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional iPhone Anatomy | 3D Interactive</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>

    <style>
        :root {
            --accent: #007aff;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }

        /* Sidebar UI */
        #ui-container { display: flex; height: 100vh; }
        
        #sidebar {
            width: 300px; background: #000; border-right: 1px solid #333;
            padding: 40px 20px; z-index: 10; display: flex; flex-direction: column;
        }

        h1 { font-size: 24px; font-weight: 600; margin-bottom: 30px; background: linear-gradient(to right, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .model-btn {
            background: #1c1c1e; border: 1px solid #333; padding: 15px;
            border-radius: 12px; cursor: pointer; color: #fff; margin-bottom: 15px;
            transition: 0.3s; text-align: left; font-size: 15px;
        }

        .model-btn:hover { background: #2c2c2e; border-color: var(--accent); }
        .model-btn.active { border-color: var(--accent); background: rgba(0, 122, 255, 0.1); }

        /* Information Panel */
        #detail-panel {
            position: absolute; right: 30px; top: 30px; width: 320px;
            background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px);
            padding: 25px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
            display: none; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        #detail-panel h2 { margin-top: 0; color: var(--accent); font-size: 20px; }
        #detail-panel p { font-size: 14px; line-height: 1.6; color: #aaa; }

        /* Canvas Container */
        #canvas-wrapper { flex-grow: 1; position: relative; }
        .controls-hint { position: absolute; bottom: 20px; left: 20px; color: #555; font-size: 12px; pointer-events: none; }
    </style>
</head>
<body>

<div id="ui-container">
    <div id="sidebar">
        <h1>iPhone Anatomy</h1>
        <button class="model-btn active" onclick="changeModel('iPhone 15 Pro')">iPhone 15 Pro</button>
        <button class="model-btn" onclick="changeModel('iPhone 14 Pro')">iPhone 14 Pro</button>
        <button class="model-btn" onclick="changeModel('iPhone 13')">iPhone 13</button>
        
        <div style="margin-top: auto; color: #444; font-size: 12px;">
            Educational Purpose Tool <br> Powered by Three.js & GSAP
        </div>
    </div>

    <div id="canvas-wrapper">
        <div id="detail-panel">
            <h2 id="part-title">Part Name</h2>
            <p id="part-desc">Details will appear here...</p>
        </div>
        <div class="controls-hint">DRAG TO ROTATE • SCROLL TO ZOOM • CLICK TO EXPLODE</div>
    </div>
</div>

<script>
    let scene, camera, renderer, controls, iphoneGroup;
    let isExploded = false;

    // Part Database
    const partsInfo = {
        "OLED Display": "The Super Retina XDR display with ProMotion technology. It features an always-on display and high peak brightness.",
        "A17 Bionic Chip": "The world's first 3nm chip, containing billions of transistors for extreme performance and efficiency.",
        "Battery": "High-capacity Lithium-ion battery with internal management for peak performance capability.",
        "Taptic Engine": "Precise haptic feedback motor that simulates the feel of physical buttons.",
        "Camera Module": "48MP main sensor with advanced image signal processing and sensor-shift stabilization."
    };

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        camera = new THREE.PerspectiveCamera(45, (window.innerWidth - 300) / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth - 300, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-wrapper').appendChild(renderer.domElement);

        // Lighting
        const ambient = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambient);

        const pointLight = new THREE.PointLight(0x007aff, 1);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        const topLight = new THREE.DirectionalLight(0xffffff, 1);
        topLight.position.set(0, 5, 5);
        scene.add(topLight);

        // Controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        iphoneGroup = new THREE.Group();
        scene.add(iphoneGroup);

        createInteractiveModel();
        animate();
    }

    function createInteractiveModel() {
        // Clear previous
        while(iphoneGroup.children.length > 0) iphoneGroup.remove(iphoneGroup.children[0]);

        // Creating Layered Parts (Representing internal components)
        const layers = [
            { name: "OLED Display", color: 0x111111, z: 0.4, size: [2.5, 5, 0.05] },
            { name: "A17 Bionic Chip", color: 0x333333, z: 0.1, size: [0.8, 0.8, 0.1] },
            { name: "Battery", color: 0x1a1a1a, z: -0.1, size: [1.8, 3.8, 0.15] },
            { name: "Taptic Engine", color: 0x444444, z: -0.1, size: [0.5, 0.3, 0.1], offset: [0, -1.5, 0] },
            { name: "Camera Module", color: 0x555555, z: -0.4, size: [1, 1, 0.3], offset: [0.6, 1.8, 0] }
        ];

        layers.forEach((l, i) => {
            const geometry = new THREE.BoxGeometry(...l.size);
            const material = new THREE.MeshStandardMaterial({ 
                color: l.color, 
                metalness: 0.7, 
                roughness: 0.2,
                emissive: 0x000000
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.name = l.name;
            if(l.offset) mesh.position.set(l.offset[0], l.offset[1], l.offset[2]);
            iphoneGroup.add(mesh);
        });
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
        if(e.clientX < 300) return;

        mouse.x = ((e.clientX - 300) / (window.innerWidth - 300)) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(iphoneGroup.children);

        if (intersects.length > 0) {
            const part = intersects[0].object;
            
            if (!isExploded) {
                // Explode Animation
                iphoneGroup.children.forEach((child, index) => {
                    gsap.to(child.position, {
                        z: index * 1.5 - 2,
                        duration: 1.5,
                        ease: "expo.out"
                    });
                });
                isExploded = true;
            } else {
                // Show info
                document.getElementById('detail-panel').style.display = 'block';
                document.getElementById('part-title').innerText = part.name;
                document.getElementById('part-desc').innerText = partsInfo[part.name] || "Internal component detail.";
                
                // Highlight part
                iphoneGroup.children.forEach(c => c.material.emissive.setHex(0x000000));
                part.material.emissive.setHex(0x003366);
            }
        } else {
            // Reset if clicked empty space
            if(isExploded) {
                iphoneGroup.children.forEach(child => gsap.to(child.position, { z: 0, duration: 1 }));
                isExploded = false;
                document.getElementById('detail-panel').style.display = 'none';
            }
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    function changeModel(name) {
        alert("Loading data for: " + name);
        createInteractiveModel();
    }

    window.addEventListener('resize', () => {
        camera.aspect = (window.innerWidth - 300) / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth - 300, window.innerHeight);
    });

    init();
</script>
</body>
</html>
