<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grand Theft Mehran: Vice City</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap');

        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        
        /* VICE CITY HUD STYLING */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        
        .logo {
            position: absolute; top: 20px; right: 20px;
            font-family: 'Permanent Marker', cursive;
            font-size: 40px;
            color: #ff69b4; /* Hot Pink */
            text-shadow: 3px 3px 0px #00ffff; /* Cyan Shadow */
            transform: rotate(-5deg);
        }

        .controls-info {
            position: absolute; top: 20px; left: 20px;
            color: #fff; font-weight: bold; font-size: 14px;
            background: rgba(0, 0, 0, 0.4); padding: 15px; border-radius: 10px;
            border-left: 5px solid #ff69b4;
        }

        /* Speedometer - Retro Style */
        .dashboard {
            position: absolute; bottom: 30px; right: 30px;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid #00ffff;
        }
        .speed { font-size: 60px; font-weight: 900; color: #ff69b4; text-shadow: 2px 2px #000; }
        .unit { font-size: 20px; color: #00ffff; font-weight: bold; }

    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>

    <div id="hud">
        <div class="logo">MEHRAN CITY</div>
        <div class="controls-info">
            W,A,S,D - Drive<br>
            SPACE - Handbrake<br>
            C - Change Camera
        </div>
        <div class="dashboard">
            <span class="speed" id="speed-disp">0</span> <span class="unit">KM/H</span>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';

        // --- 1. SETUP & VICE CITY LIGHTING ---
        const scene = new THREE.Scene();
        // Sky Blue Background (Vice City Day)
        scene.background = new THREE.Color(0x40a6ff); 
        scene.fog = new THREE.Fog(0x40a6ff, 20, 150);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // SUNLIGHT
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xffaabb, 0.6);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // PHYSICS
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        
        const groundMat = new CANNON.Material();
        const wheelMat = new CANNON.Material();
        const contactMat = new CANNON.ContactMaterial(wheelMat, groundMat, {
            friction: 0.3, restitution: 0.1
        });
        world.addContactMaterial(contactMat);

        // --- 2. ENVIRONMENT (Miami Style) ---
        
        // The Ocean
        const waterGeo = new THREE.PlaneGeometry(1000, 1000);
        const waterMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.y = -2; // Slightly below road
        scene.add(water);

        // The Island (Sand/Grass)
        const islandGeo = new THREE.PlaneGeometry(600, 600);
        const islandMat = new THREE.MeshStandardMaterial({ color: 0x86c440 }); // Bright Grass
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.rotation.x = -Math.PI / 2;
        island.position.y = -0.1;
        island.receiveShadow = true;
        scene.add(island);

        // Physics Floor
        const floorBody = new CANNON.Body({ mass: 0, material: groundMat });
        floorBody.addShape(new CANNON.Plane());
        floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(floorBody);

        // --- HELPER: CREATE PALM TREE ---
        function createPalmTree(x, z) {
            const group = new THREE.Group();
            
            // Trunk (Curved effect by stacking)
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.5, 2, 8);
            
            let currentY = 0;
            for(let i=0; i<4; i++) {
                const seg = new THREE.Mesh(trunkGeo, trunkMat);
                seg.position.y = currentY;
                seg.rotation.x = (Math.random() - 0.5) * 0.2; // Slight bend
                group.add(seg);
                currentY += 1.8;
            }

            // Leaves
            const leafGeo = new THREE.ConeGeometry(2, 4, 4);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x228b22 });
            
            for(let i=0; i<6; i++) {
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                leaf.position.y = currentY;
                leaf.rotation.x = 2; // Bend down
                leaf.rotation.y = (i / 6) * Math.PI * 2;
                group.add(leaf);
            }

            group.position.set(x, 1, z);
            group.castShadow = true;
            scene.add(group);

            // Physics for tree (Simple Cylinder)
            const shape = new CANNON.Cylinder(0.5, 0.5, 8, 8);
            const body = new CANNON.Body({ mass: 0 });
            body.addShape(shape, new CANNON.Vec3(0, 4, 0));
            body.position.set(x, 0, z);
            world.addBody(body);
        }

        // --- BUILD WORLD ---
        const bColors = [0xff69b4, 0x00ffff, 0xffff00, 0xffffff]; // Pink, Cyan, Yellow, White

        for(let i=0; i<60; i++) {
            const x = (Math.random() - 0.5) * 400;
            const z = (Math.random() - 0.5) * 400;
            
            // Keep center road clear
            if(Math.abs(x) < 20) continue; 

            // 50% chance for Building, 50% for Palm Tree
            if(Math.random() > 0.4) {
                // Building
                const h = 10 + Math.random() * 30;
                const geo = new THREE.BoxGeometry(10, h, 10);
                const color = bColors[Math.floor(Math.random() * bColors.length)];
                const mat = new THREE.MeshStandardMaterial({ color: color });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, h/2, z);
                mesh.castShadow = true;
                scene.add(mesh);

                const shape = new CANNON.Box(new CANNON.Vec3(5, h/2, 5));
                const body = new CANNON.Body({ mass: 0 });
                body.addShape(shape);
                body.position.set(x, h/2, z);
                world.addBody(body);
            } else {
                // Palm Tree
                createPalmTree(x, z);
            }
        }

        // --- 3. THE MEHRAN (Boxy Legend) ---
        function createMehran() {
            const chassisShape = new CANNON.Box(new CANNON.Vec3(1, 0.5, 1.8));
            const chassisBody = new CANNON.Body({ mass: 150 });
            chassisBody.addShape(chassisShape, new CANNON.Vec3(0, 0, 0));
            chassisBody.position.set(0, 3, 0);
            chassisBody.angularDamping = 0.5;

            // VISUAL MESH
            const carGroup = new THREE.Group();

            // White Paint Material
            const paintMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });

            // Main Body (Lower)
            const bodyGeo = new THREE.BoxGeometry(1.9, 0.7, 3.8);
            const bodyMesh = new THREE.Mesh(bodyGeo, paintMat);
            bodyMesh.position.y = -0.1;
            carGroup.add(bodyMesh);

            // Cabin (Boxy Top)
            const roofGeo = new THREE.BoxGeometry(1.8, 0.7, 2.0); // Shorter for hatchback look
            const roofMesh = new THREE.Mesh(roofGeo, paintMat);
            roofMesh.position.set(0, 0.6, -0.3); // Shifted back
            carGroup.add(roofMesh);

            // Bumpers (The Classic Black Mehran Bumpers)
            const bumpGeo = new THREE.BoxGeometry(1.95, 0.3, 0.2);
            const frontBump = new THREE.Mesh(bumpGeo, blackMat);
            frontBump.position.set(0, -0.2, 1.95);
            carGroup.add(frontBump);

            const backBump = new THREE.Mesh(bumpGeo, blackMat);
            backBump.position.set(0, -0.2, -1.95);
            carGroup.add(backBump);

            // Headlights
            const lightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
            const lightMat = new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: 0xffffaa });
            const hlL = new THREE.Mesh(lightGeo, lightMat); hlL.position.set(0.6, 0, 1.95); carGroup.add(hlL);
            const hlR = new THREE.Mesh(lightGeo, lightMat); hlR.position.set(-0.6, 0, 1.95); carGroup.add(hlR);

            scene.add(carGroup);

            // VEHICLE SETUP
            const vehicle = new CANNON.RaycastVehicle({
                chassisBody: chassisBody,
                indexRightAxis: 0, indexUpAxis: 1, indexForwardAxis: 2
            });

            const wheelOpts = {
                radius: 0.35, directionLocal: new CANNON.Vec3(0, -1, 0),
                suspensionStiffness: 45, suspensionRestLength: 0.3,
                frictionSlip: 2.0, // Grippy tires for racing
                dampingRelaxation: 2.3, dampingCompression: 4.4,
                maxSuspensionForce: 100000, rollInfluence: 0.01,
                axleLocal: new CANNON.Vec3(1, 0, 0),
                chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 0),
                maxSuspensionTravel: 0.3,
                customSlidingRotationalSpeed: -30, useCustomSlidingRotationalSpeed: true
            };

            vehicle.addWheel({ ...wheelOpts, chassisConnectionPointLocal: new CANNON.Vec3(0.8, -0.3, 1.2) });
            vehicle.addWheel({ ...wheelOpts, chassisConnectionPointLocal: new CANNON.Vec3(-0.8, -0.3, 1.2) });
            vehicle.addWheel({ ...wheelOpts, chassisConnectionPointLocal: new CANNON.Vec3(0.8, -0.3, -1.2) });
            vehicle.addWheel({ ...wheelOpts, chassisConnectionPointLocal: new CANNON.Vec3(-0.8, -0.3, -1.2) });

            vehicle.addToWorld(world);

            // Wheels Visuals
            const wheelMeshes = [];
            const wGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 24);
            const wMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const rimGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.32, 8); // Silver Rims
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });

            for(let i=0; i<4; i++){
                const grp = new THREE.Group();
                const t = new THREE.Mesh(wGeo, wMat); t.rotation.z = Math.PI/2;
                const r = new THREE.Mesh(rimGeo, rimMat); r.rotation.z = Math.PI/2;
                grp.add(t); grp.add(r);
                scene.add(grp);
                wheelMeshes.push(grp);
            }

            return { vehicle, chassisBody, carGroup, wheelMeshes };
        }

        const { vehicle, chassisBody, carGroup, wheelMeshes } = createMehran();

        // --- CONTROLS ---
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let camMode = 0;

        document.addEventListener('keydown', (e) => {
            if(e.code === 'Space') keys.space = true;
            if(e.key.toLowerCase() === 'c') camMode = (camMode + 1) % 2;
            keys[e.key.toLowerCase()] = true;
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'Space') keys.space = false;
            keys[e.key.toLowerCase()] = false;
        });

        // --- LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            world.step(1/60);

            // PHYSICS
            const engineForce = 1500;
            const maxSteer = 0.5;

            let force = 0;
            if(keys.w) force = -engineForce;
            if(keys.s) force = engineForce / 2;
            vehicle.applyEngineForce(force, 2);
            vehicle.applyEngineForce(force, 3);

            let steer = 0;
            if(keys.a) steer = maxSteer;
            if(keys.d) steer = -maxSteer;
            vehicle.setSteeringValue(steer, 0);
            vehicle.setSteeringValue(steer, 1);

            if(keys.space) {
                vehicle.setBrake(100, 2);
                vehicle.setBrake(100, 3);
            } else {
                vehicle.setBrake(0, 2);
                vehicle.setBrake(0, 3);
            }

            // VISUAL SYNC
            carGroup.position.copy(chassisBody.position);
            carGroup.quaternion.copy(chassisBody.quaternion);
            carGroup.translateY(-0.55); // Adjust height visual

            for(let i=0; i<4; i++){
                vehicle.updateWheelTransform(i);
                wheelMeshes[i].position.copy(vehicle.wheelInfos[i].worldTransform.position);
                wheelMeshes[i].quaternion.copy(vehicle.wheelInfos[i].worldTransform.quaternion);
            }

            // CAMERA
            // Mode 0: Chase, Mode 1: Top Down
            const offset = camMode === 0 ? new THREE.Vector3(0, 4, 8) : new THREE.Vector3(0, 20, 5);
            const camPos = offset.applyMatrix4(carGroup.matrixWorld);
            camera.position.lerp(camPos, 0.1);
            camera.lookAt(carGroup.position);

            // UPDATE HUD
            const speed = Math.round(chassisBody.velocity.length() * 3.6);
            document.getElementById('speed-disp').innerText = speed;

            renderer.render(scene, camera);
        }

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
