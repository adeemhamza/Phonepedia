<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone History: 1 to 17 Pro Max</title>
    <style>
        /* --- Apple Aesthetic Theme --- */
        :root {
            --bg-color: #f5f5f7;
            --sidebar-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-light: #86868b;
            --accent: #2997ff; /* Apple Blue */
            --border: #d2d2d7;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar Navigation --- */
        .sidebar {
            width: 300px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 30px 24px 10px;
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            z-index: 10;
            border-bottom: 1px solid transparent;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-list {
            padding: 10px 16px;
        }

        .nav-item {
            padding: 14px 18px;
            margin-bottom: 4px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-item:hover {
            background-color: #f5f5f7;
        }

        .nav-item.active {
            background-color: var(--text-main);
            color: #fff;
        }

        .nav-item .year-badge {
            font-size: 11px;
            opacity: 0.6;
            font-weight: 400;
        }

        /* --- Main Content Area --- */
        .main-content {
            flex: 1;
            padding: 0;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .content-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 40px;
            opacity: 0;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hero Section */
        .hero {
            text-align: center;
            margin-bottom: 60px;
        }

        .phone-image {
            height: 350px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.15));
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }
        
        .phone-image:hover {
            transform: scale(1.05);
        }

        .model-name {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 24px;
            font-weight: 500;
            color: var(--text-light);
        }

        /* Grid Layout for Specs */
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .spec-box {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            text-align: center;
            transition: transform 0.2s;
        }
        
        .spec-box:hover { transform: translateY(-3px); }

        .spec-icon {
            font-size: 24px;
            margin-bottom: 12px;
            display: block;
        }

        .spec-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .spec-data {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Detailed Table */
        .details-table-container {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
        }

        .section-header {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid #e5e5e5;
        }

        .detail-row:last-child { border-bottom: none; }

        .detail-label {
            font-weight: 600;
            color: var(--text-light);
            flex: 1;
        }

        .detail-value {
            font-weight: 500;
            color: var(--text-main);
            flex: 2;
            text-align: right;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { 
                width: 100%; 
                height: auto; 
                flex-direction: row; 
                overflow-x: auto; 
                padding: 10px;
                background: #fff;
                border-bottom: 1px solid var(--border);
            }
            .sidebar-header { display: none; }
            .nav-list { display: flex; padding: 0; }
            .nav-item { margin-right: 10px; white-space: nowrap; margin-bottom: 0; }
            .phone-image { height: 250px; }
            .model-name { font-size: 32px; }
        }
    </style>
