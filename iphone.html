<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Anatomy Explorer</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --accent: #007aff;
            --text: #1d1d1f;
        }

        body {
            margin: 0;
            font-family: -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
        }

        /* Sidebar */
        #sidebar {
            width: 260px;
            height: 100vh;
            background: #fff;
            border-right: 1px solid #d2d2d7;
            padding: 30px 20px;
            position: fixed;
        }

        .model-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: 0.3s;
            text-align: left;
        }

        .model-btn:hover { background: #f0f0f2; }
        .model-btn.active { 
            background: var(--accent); 
            color: white; 
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
        }

        /* Main Content */
        #main-content {
            margin-left: 300px;
            padding: 50px;
            width: 100%;
        }

        header { margin-bottom: 40px; }
        h1 { font-size: 34px; font-weight: 700; margin: 0; }
        p.desc { color: #86868b; font-size: 18px; margin-top: 10px; }

        /* Parts Grid */
        #parts-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.6s all ease;
        }

        #parts-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        .part-card {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #e5e5e5;
            transition: 0.4s cubic-bezier(0.2, 0, 0.2, 1);
        }

        .part-card:hover {
            transform: scale(1.03);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .image-wrapper {
            width: 100%;
            height: 200px;
            background: #f9f9f9;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .part-info h3 { margin: 0 0 10px 0; font-size: 18px; }
        .part-info p { margin: 0; font-size: 14px; color: #666; line-height: 1.5; }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            background: #eef6ff;
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            border-radius: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h1>Models</h1>
    <p style="color: #888; font-size: 12px; margin-bottom: 20px;">Select iPhone for details</p>
    <button class="model-btn" onclick="loadAnatomy('iphone15')">iPhone 15 Pro Max</button>
    <button class="model-btn" onclick="loadAnatomy('iphone14')">iPhone 14 Pro</button>
    <button class="model-btn" onclick="loadAnatomy('iphone13')">iPhone 13</button>
</div>

<div id="main-content">
    <header id="welcome-text">
        <h1>Educational Anatomy</h1>
        <p class="desc">Please select a model from the left to explore its internal elements.</p>
    </header>

    <div id="parts-container">
        </div>
</div>

<script>
    const data = {
        'iphone15': {
            title: "iPhone 15 Pro Max Anatomy",
            description: "Showing all major internal components of the Titanium 15 Pro series.",
            parts: [
                { name: "Super Retina XDR Display", category: "Display", desc: "6.7-inch OLED panel with ProMotion and Always-On technology.", img: "https://guide-images.ifixit.com/igi/2kY1N6CRAuP1v2W4.large" },
                { name: "A17 Pro Chip", category: "Processor", desc: "The first 3nm chip in a smartphone with 6-core GPU.", img: "https://vkrepair.com/wp-content/uploads/2023/10/A17-Pro-Chip.jpg" },
                { name: "Tetraprism Telephoto", category: "Camera", desc: "Advanced 5x optical zoom periscope camera system.", img: "https://cdn.dxomark.com/wp-content/uploads/medias/post-154941/Apple-iPhone-15-Pro-Max_camera-module.jpg" },
                { name: "Internal Battery", category: "Power", desc: "4,441 mAh high-density lithium-ion battery.", img: "https://guide-images.ifixit.com/igi/O1vGZf4v2L6U3q2J.large" },
                { name: "USB-C Assembly", category: "Charging", desc: "USB 3 speed controller and charging port connector.", img: "https://9to5mac.com/wp-content/uploads/sites/6/2023/08/iphone-15-usb-c-port.jpg" },
                { name: "Taptic Engine", category: "Haptics", desc: "The motor that generates precise vibrations and clicks.", img: "https://guide-images.ifixit.com/igi/YcTjP6R1MhR2R6E1.large" }
            ]
        }
    };

    function loadAnatomy(modelId) {
        const container = document.getElementById('parts-container');
        const header = document.getElementById('welcome-text');
        const modelData = data[modelId];

        // Highlight Active Button
        document.querySelectorAll('.model-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // Reset Animation
        container.classList.remove('show');

        if (modelData) {
            setTimeout(() => {
                header.innerHTML = `<h1>${modelData.title}</h1><p class="desc">${modelData.description}</p>`;
                
                container.innerHTML = modelData.parts.map(part => `
                    <div class="part-card">
                        <span class="badge">${part.category}</span>
                        <div class="image-wrapper">
                            <img src="${part.img}" alt="${part.name}" onerror="this.src='https://via.placeholder.com/300x200?text=Part+Image'">
                        </div>
                        <div class="part-info">
                            <h3>${part.name}</h3>
                            <p>${part.desc}</p>
                        </div>
                    </div>
                `).join('');
                
                container.classList.add('show');
            }, 300);
        } else {
            alert("More models coming soon! Please check iPhone 15 Pro Max.");
        }
    }
</script>

</body>
</html>
