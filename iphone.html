<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PROJECT: MACH 3 - Flight Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body { margin: 0; overflow: hidden; background: #000; font-family: 'Share Tech Mono', monospace; }

        /* HUD STYLING */
        #hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            color: #00ff00; /* Radar Green */
            text-shadow: 0 0 5px #00ff00;
        }

        .center-crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 40px; height: 40px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0, 255, 0, 0.5);
            border-radius: 50%;
        }
        .center-dot {
            position: absolute; top: 50%; left: 50%;
            width: 4px; height: 4px; background: #00ff00;
            transform: translate(-50%, -50%);
        }

        .hud-left {
            position: absolute; top: 40%; left: 100px;
            text-align: right; border-right: 2px solid #00ff00;
            padding-right: 10px;
        }
        .hud-right {
            position: absolute; top: 40%; right: 100px;
            text-align: left; border-left: 2px solid #00ff00;
            padding-left: 10px;
        }

        .hud-value { font-size: 30px; font-weight: bold; }
        .hud-label { font-size: 14px; opacity: 0.7; }

        .horizon-line {
            position: absolute; top: 50%; left: 50%;
            width: 200px; height: 2px; background: rgba(0, 255, 0, 0.3);
            transform: translate(-50%, -50%);
        }

        /* INSTRUCTIONS */
        #controls {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(0, 20, 0, 0.7); padding: 15px;
            border: 1px solid #00ff00; color: #fff;
        }
        .key { color: #00ff00; font-weight: bold; }

        /* WARNING MSG */
        #warning {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            color: red; font-size: 40px; font-weight: bold; display: none;
            animation: blink 0.5s infinite;
        }
        @keyframes blink { 0% {opacity:1;} 50% {opacity:0;} 100% {opacity:1;} }

    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="hud-layer">
        <div class="center-crosshair"><div class="center-dot"></div></div>
        <div class="horizon-line"></div>
        
        <div class="hud-left">
            <div class="hud-value" id="speed-val">0</div>
            <div class="hud-label">SPEED (MACH)</div>
        </div>
        
        <div class="hud-right">
            <div class="hud-value" id="alt-val">0</div>
            <div class="hud-label">ALTITUDE (FT)</div>
        </div>

        <div id="controls">
            W/S: <span class="key">PITCH</span> (Up/Down)<br>
            A/D: <span class="key">ROLL</span> (Bank)<br>
            Q/E: <span class="key">YAW</span> (Rudder)<br>
            SHIFT: <span class="key">AFTERBURNER</span><br>
            SPACE: <span class="key">AIR BRAKE</span>
        </div>

        <div id="warning">PULL UP! TERRAIN!</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { SimplexNoise } from 'three/addons/math/SimplexNoise.js'; // Note: Usually external, we will simulate noise if this fails or use Math.sin

        // --- 1. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky Blue
        scene.fog = new THREE.Fog(0x87CEEB, 100, 900);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // Lights
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(100, 200, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. BUILD THE FIGHTER JET (Procedural Geometry) ---
        function createJet() {
            const jetGroup = new THREE.Group();

            // Materials
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.4, metalness: 0.8 });
            const cockpitMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 1.0 });
            const glowMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

            // Fuselage
            const bodyGeo = new THREE.ConeGeometry(0.5, 4, 16);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.x = -Math.PI / 2;
            jetGroup.add(body);

            // Cockpit
            const cockpitGeo = new THREE.CapsuleGeometry(0.3, 0.8, 4, 8);
            const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
            cockpit.position.set(0, 0.3, -0.5);
            cockpit.rotation.x = -Math.PI / 2;
            jetGroup.add(cockpit);

            // Wings (Custom Shape)
            const wingShape = new THREE.Shape();
            wingShape.moveTo(0, 0);
            wingShape.lineTo(2.5, -1.5); // Wing tip
            wingShape.lineTo(2.5, -2.0);
            wingShape.lineTo(0.5, -1.0);
            wingShape.lineTo(0, -0.5);
            
            const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.05, bevelEnabled: false });
            const lWing = new THREE.Mesh(wingGeo, bodyMat);
            lWing.rotation.x = -Math.PI / 2;
            lWing.position.set(0.2, 0, 0.5);
            jetGroup.add(lWing);

            const rWing = lWing.clone();
            rWing.scale.x = -1; // Mirror
            rWing.position.set(-0.2, 0, 0.5);
            jetGroup.add(rWing);

            // Tail Fins
            const tailGeo = new THREE.BoxGeometry(0.1, 1, 1);
            const tail = new THREE.Mesh(tailGeo, bodyMat);
            tail.position.set(0, 0.5, 1.5);
            tail.scale.set(1, 0.8, 0.1);
            tail.rotation.x = -Math.PI / 4;
            jetGroup.add(tail);

            // Engine Glow
            const engineGeo = new THREE.CylinderGeometry(0.3, 0.1, 0.5, 8);
            const engine = new THREE.Mesh(engineGeo, new THREE.MeshBasicMaterial({ color: 0xff4400 }));
            engine.rotation.x = Math.PI / 2;
            engine.position.set(0, 0, 2);
            jetGroup.add(engine);

            const engineLight = new THREE.PointLight(0xff6600, 2, 5);
            engineLight.position.set(0, 0, 2.2);
            jetGroup.add(engineLight);

            return { mesh: jetGroup, light: engineLight };
        }

        const jetObj = createJet();
        const jet = jetObj.mesh;
        scene.add(jet);
        jet.position.y = 100; // Start in air

        // --- 3. INFINITE TERRAIN SYSTEM ---
        const chunkSize = 200;
        const terrainMat = new THREE.MeshStandardMaterial({ 
            color: 0x2e8b57, 
            roughness: 0.9,
            flatShading: true
        });
        
        // Simple Terrain Generation using Math functions instead of heavy perlin noise lib
        function getHeight(x, z) {
            // Combine waves to make mountains
            const scale = 0.05;
            let y = Math.sin(x * scale) * Math.cos(z * scale) * 10;
            y += Math.sin(x * scale * 0.5 + 2) * Math.cos(z * scale * 0.5) * 20;
            y += Math.abs(Math.sin(x * 0.01) * 50); // Big hills
            return Math.max(-10, y);
        }

        const terrainGeo = new THREE.PlaneGeometry(1000, 1000, 50, 50);
        // Initial Deform
        const posAttr = terrainGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            const x = posAttr.getX(i);
            const z = posAttr.getZ(i);
            posAttr.setY(i, getHeight(x, z));
        }
        terrainGeo.computeVertexNormals();
        
        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        terrain.rotation.x = -Math.PI / 2;
        scene.add(terrain);

        // --- 4. PARTICLES (Afterburner) ---
        const particleCount = 200;
        const particles = new THREE.BufferGeometry();
        const pPositions = new Float32Array(particleCount * 3);
        const pLives = new Float32Array(particleCount); // Life of particle

        for(let i=0; i<particleCount; i++) {
            pPositions[i*3] = 0; pPositions[i*3+1] = 0; pPositions[i*3+2] = 0;
            pLives[i] = Math.random();
        }
        particles.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
        
        const particleMat = new THREE.PointsMaterial({
            color: 0xffaa00, size: 0.8, transparent: true, opacity: 0.8
        });
        const exhaust = new THREE.Points(particles, particleMat);
        scene.add(exhaust);

        // --- 5. FLIGHT PHYSICS ---
        const inputs = { w:0, s:0, a:0, d:0, q:0, e:0, shift:false, space:false };
        
        document.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w') inputs.w = 1;
            if(k === 's') inputs.s = 1;
            if(k === 'a') inputs.a = 1;
            if(k === 'd') inputs.d = 1;
            if(k === 'q') inputs.q = 1;
            if(k === 'e') inputs.e = 1;
            if(e.key === 'Shift') inputs.shift = true;
            if(e.key === ' ') inputs.space = true;
        });

        document.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w') inputs.w = 0;
            if(k === 's') inputs.s = 0;
            if(k === 'a') inputs.a = 0;
            if(k === 'd') inputs.d = 0;
            if(k === 'q') inputs.q = 0;
            if(k === 'e') inputs.e = 0;
            if(e.key === 'Shift') inputs.shift = false;
            if(e.key === ' ') inputs.space = false;
        });

        // Flight Variables
        let speed = 0.5;
        let rotationVelocity = new THREE.Vector3(0, 0, 0); // Pitch, Yaw, Roll
        const maxSpeed = 4.0;
        const minSpeed = 0.5;

        // --- 6. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. Calculate Input Forces
            const pitchSpeed = 0.03;
            const rollSpeed = 0.04;
            const yawSpeed = 0.01;

            let targetPitch = (inputs.w - inputs.s) * pitchSpeed;
            let targetRoll = (inputs.a - inputs.d) * rollSpeed;
            let targetYaw = (inputs.q - inputs.e) * yawSpeed;

            // Turbo / Brake
            if(inputs.shift && speed < maxSpeed) speed += 0.05;
            else if(inputs.space && speed > minSpeed) speed -= 0.05;
            else {
                // Auto throttle stabilization
                if(speed > 1.5) speed -= 0.01;
                else if(speed < 1.0) speed += 0.01;
            }

            // 2. Apply Rotation (Local Axis)
            jet.rotateX(targetPitch);
            jet.rotateY(targetYaw);
            jet.rotateZ(targetRoll);

            // Auto-Leveling (Small help to keep plane stable)
            if (inputs.a === 0 && inputs.d === 0) {
                 // Slowly rotate Z back to 0 if close
                 // This is complex in quaternions, skipping for pure arcade feel
            }

            // 3. Move Forward
            jet.translateZ(-speed);

            // 4. Camera Follow (Chase Cam)
            // Calculate ideal camera position behind the jet
            const relativeOffset = new THREE.Vector3(0, 3, 10 + (speed * 2)); // Dynamic FOV effect
            const cameraOffset = relativeOffset.applyMatrix4(jet.matrixWorld);
            
            // Smoothly move camera there
            camera.position.lerp(cameraOffset, 0.1);
            const lookTarget = new THREE.Vector3(0, 0, -20).applyMatrix4(jet.matrixWorld);
            camera.lookAt(lookTarget);

            // Shake Effect at high speed
            if(speed > 3.0) {
                camera.position.x += (Math.random()-0.5) * 0.2;
                camera.position.y += (Math.random()-0.5) * 0.2;
                jetObj.light.intensity = 5 + Math.random() * 5; // Engine Flicker
            } else {
                jetObj.light.intensity = 2;
            }

            // 5. Update Terrain (Infinite Illusion)
            // Instead of moving terrain, we just loop flight over it? 
            // Better: Move terrain to stay under player
            const pX = jet.position.x;
            const pZ = jet.position.z;
            
            // Simple tiling logic: If plane flies far, snap terrain (Visual cheat)
            // For a single mesh, we just update vertex heights based on world position (Advanced)
            // Simplified here: Just let user fly, terrain is large (1000x1000). 
            // If they fly off edge, show ocean.
            
            // 6. Update HUD
            document.getElementById('speed-val').innerText = (speed * 300).toFixed(0); // Fake Mach conversion
            document.getElementById('alt-val').innerText = Math.max(0, jet.position.y * 10).toFixed(0);

            // Artificial Horizon (Rotate the line)
            // We need the jet's roll angle.
            // Extract Roll from rotation matrix is tricky, estimating via inputs for UI visual
            const zRot = jet.rotation.z;
            document.querySelector('.horizon-line').style.transform = `translate(-50%, -50%) rotate(${-zRot}rad)`;

            // 7. Ground Collision
            const groundHeight = getHeight(jet.position.x, jet.position.z); // Approximate
            if(jet.position.y < groundHeight + 2) {
                document.getElementById('warning').style.display = 'block';
                if(jet.position.y < groundHeight) {
                    // Crash logic
                    speed = 0;
                    document.getElementById('warning').innerText = "CRASHED - REFRESH";
                }
            } else {
                document.getElementById('warning').style.display = 'none';
            }

            // 8. Particles Logic
            const positions = exhaust.geometry.attributes.position.array;
            const worldPos = new THREE.Vector3();
            jet.getWorldPosition(worldPos);
            // Engine position offset
            const engineOffset = new THREE.Vector3(0, 0, 2).applyMatrix4(jet.matrixWorld);

            for(let i=0; i<particleCount; i++) {
                // If dead, respawn at engine
                if(pLives[i] <= 0) {
                    pLives[i] = 1.0;
                    positions[i*3] = engineOffset.x + (Math.random()-0.5)*0.5;
                    positions[i*3+1] = engineOffset.y + (Math.random()-0.5)*0.5;
                    positions[i*3+2] = engineOffset.z + (Math.random()-0.5)*0.5;
                } else {
                    // Move particle backward (trail)
                    pLives[i] -= 0.05; // Decay
                }
            }
            exhaust.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
