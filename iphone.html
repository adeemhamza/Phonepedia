<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Interactive Showcase</title>
    <style>
        /* --- CORE STYLES --- */
        :root {
            --bg: #f5f5f7;
            --text: #1d1d1f;
            --card-bg: #ffffff;
            --blue: #0071e3;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* --- NAVIGATION --- */
        nav {
            background: rgba(251, 251, 253, 0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 99;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 15px 0;
            text-align: center;
        }

        .nav-logo { font-weight: 600; font-size: 1.3rem; }

        /* --- HEADER & TABS --- */
        .hero {
            text-align: center;
            padding: 80px 20px 40px;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
            letter-spacing: -1px;
        }

        .subtitle { color: #86868b; font-size: 1.2rem; margin-bottom: 40px; }

        .tabs-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
        }

        .segmented-control {
            background: #e1e1e6;
            padding: 4px;
            border-radius: 99px;
            display: inline-flex;
            position: relative;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 8px 25px;
            font-size: 0.95rem;
            border-radius: 99px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s var(--ease);
            color: #666;
        }

        .tab-btn.active {
            background: #fff;
            color: #000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* --- PHONE GRID --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 100px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
            cursor: pointer;
            opacity: 0;
            animation: fadeUp 0.6s forwards;
        }

        .card:hover {
            transform: scale(1.03);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; }
        .card-desc { color: #86868b; margin-bottom: 30px; }
        .card-img { font-size: 5rem; margin: 20px 0; display: block; }
        .link { color: var(--blue); font-size: 0.9rem; text-decoration: none; }
        .link:hover { text-decoration: underline; }

        /* --- 3D MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s var(--ease);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 900px;
            height: 70vh;
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.2);
            display: flex;
            overflow: hidden;
            transform: scale(0.9);
            transition: transform 0.4s var(--ease);
            position: relative;
        }

        .modal-overlay.open .modal-content { transform: scale(1); }

        .close-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: #f0f0f0;
            border: none;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 10;
        }

        /* Modal Layout */
        .modal-left {
            flex: 1;
            background: #fbfbfd;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
        }

        .modal-right {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* --- PURE CSS 3D IPHONE --- */
        .phone-3d {
            width: 160px;
            height: 320px;
            position: relative;
            transform-style: preserve-3d;
            animation: spin 10s infinite linear;
            --phone-color: #333; /* Default, changed by JS */
        }

        @keyframes spin {
            0% { transform: rotateX(10deg) rotateY(0deg); }
            100% { transform: rotateX(10deg) rotateY(360deg); }
        }

        .side { position: absolute; border: 1px solid rgba(0,0,0,0.1); }
        
        .front {
            width: 160px; height: 320px;
            background: #000;
            transform: translateZ(10px);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.1);
        }

        .screen-notch {
            background: #111;
            width: 40%; height: 18px;
            margin: 5px auto;
            border-radius: 20px;
        }

        .screen-ui {
            height: 100%; width: 100%;
            background: linear-gradient(160deg, #222, #000);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2rem;
            opacity: 0.5;
        }

        .back {
            width: 160px; height: 320px;
            background: var(--phone-color); /* Dynamic Color */
            transform: translateZ(-10px) rotateY(180deg);
            border-radius: 24px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.15);
        }

        .camera-bump {
            position: absolute; top: 15px; left: 15px;
            width: 60px; height: 60px;
            background: rgba(0,0,0,0.15);
            border-radius: 18px;
        }

        .left { width: 20px; height: 320px; background: #555; transform: rotateY(-90deg) translateZ(10px); }
        .right { width: 20px; height: 320px; background: #555; transform: rotateY(90deg) translateZ(150px); }
        .top { width: 160px; height: 20px; background: #555; transform: rotateX(90deg) translateZ(10px); }
        .bottom { width: 160px; height: 20px; background: #555; transform: rotateX(-90deg) translateZ(310px); }

        /* Hardware Details */
        .spec-item {
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        .spec-label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .spec-val { font-size: 1.4rem; font-weight: 600; color: #111; }

        /* Responsive */
        @media(max-width: 768px) {
            .modal-content { flex-direction: column; height: 90vh; }
            .modal-left { height: 40%; }
            .modal-right { padding: 30px; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo"> Apple Store</div>
    </nav>

    <div class="hero">
        <h1 id="hero-title">iPhone 16 Pro</h1>
        <div class="subtitle">The ultimate iPhone.</div>

        <div class="tabs-wrapper">
            <div class="segmented-control">
                <button class="tab-btn active" onclick="switchTab('pro')">Pro Models</button>
                <button class="tab-btn" onclick="switchTab('base')">Regular</button>
                <button class="tab-btn" onclick="switchTab('se')">Budget</button>
            </div>
        </div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            
            <div class="modal-left">
                <div class="phone-3d" id="phone3d">
                    <div class="side front">
                        <div class="screen-notch"></div>
                        <div class="screen-ui"></div>
                    </div>
                    <div class="side back">
                        <div class="camera-bump"></div>
                    </div>
                    <div class="side left"></div>
                    <div class="side right"></div>
                    <div class="side top"></div>
                    <div class="side bottom"></div>
                </div>
            </div>

            <div class="modal-right">
                <h2 id="m-title" style="font-size: 2.5rem; margin-top: 0;">iPhone 16 Pro</h2>
                
                <div class="spec-item">
                    <div class="spec-label">Processor</div>
                    <div class="spec-val" id="m-chip">A18 Pro</div>
                </div>
                <div class="spec-item">
                    <div class="spec-label">Camera</div>
                    <div class="spec-val" id="m-cam">48MP Fusion</div>
                </div>
                <div class="spec-item">
                    <div class="spec-label">Material</div>
                    <div class="spec-val" id="m-body">Titanium Design</div>
                </div>
                
                <a href="#" class="link" style="font-size: 1.1rem; margin-top: 10px;">Buy Now ></a>
            </div>
        </div>
    </div>

    <script>
        // --- 1. DATA DATABASE ---
        const phones = {
            pro: [
                { id: 1, name: "iPhone 16 Pro Max", chip: "A18 Pro Chip", cam: "Triple 48MP System", body: "Grade 5 Titanium", color: "#a59e96", desc: "Our largest display ever." },
                { id: 2, name: "iPhone 16 Pro", chip: "A18 Pro Chip", cam: "Triple 48MP System", body: "Grade 5 Titanium", color: "#3d424b", desc: "The ultimate iPhone." }
            ],
            base: [
                { id: 3, name: "iPhone 16", chip: "A18 Chip", cam: "Advanced Dual Camera", body: "Aerospace Aluminum", color: "#8fb5d6", desc: "Total powerhouse." },
                { id: 4, name: "iPhone 15", chip: "A16 Bionic", cam: "48MP Main Camera", body: "Aluminum Design", color: "#e3ff8f", desc: "New camera. New design." }
            ],
            se: [
                { id: 5, name: "iPhone SE", chip: "A15 Bionic", cam: "Single Wide Camera", body: "Glass & Aluminum", color: "#bf2a2a", desc: "Love the power. Love the price." }
            ]
        };

        const grid = document.getElementById('grid');
        const modal = document.getElementById('modal');
        const phone3d = document.getElementById('phone3d');

        // --- 2. RENDER FUNCTIONS ---
        function switchTab(category) {
            // Update Tab UI
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Render Grid
            grid.innerHTML = ''; // Clear existing
            
            phones[category].forEach(phone => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(phone);
                card.innerHTML = `
                    <div class="card-title">${phone.name}</div>
                    <div class="card-desc">${phone.desc}</div>
                    <div class="card-img">📱</div>
                    <div class="link">Learn more ></div>
                `;
                grid.appendChild(card);
            });
        }

        // --- 3. INTERACTIVE MODAL ---
        function openModal(phoneData) {
            // Inject Data
            document.getElementById('m-title').innerText = phoneData.name;
            document.getElementById('m-chip').innerText = phoneData.chip;
            document.getElementById('m-cam').innerText = phoneData.cam;
            document.getElementById('m-body').innerText = phoneData.body;

            // Change 3D Phone Color Dynamically
            phone3d.style.setProperty('--phone-color', phoneData.color);

            // Reset Animation (To make it spin from start)
            phone3d.style.animation = 'none';
            phone3d.offsetHeight; /* trigger reflow */
            phone3d.style.animation = 'spin 12s infinite linear';

            // Show Modal
            modal.classList.add('open');
        }

        function closeModal() {
            modal.classList.remove('open');
        }

        // Close when clicking outside content
        modal.addEventListener('click', (e) => {
            if(e.target === modal) closeModal();
        });

        // Initialize with Pro models
        window.onload = () => {
            // Manually trigger click on first tab to load data
            document.querySelector('.tab-btn').click();
        };
    </script>
</body>
</html>
