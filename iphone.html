<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>G-Square Drift: Pakistan Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        
        /* UI Overlay */
        #hud {
            position: absolute;
            top: 20px; left: 20px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0; font-style: italic; text-transform: uppercase; letter-spacing: 2px; }
        .controls { background: rgba(0, 0, 0, 0.6); padding: 10px; border-left: 4px solid #00ffcc; margin-top: 10px; }
        
        /* Speedometer */
        #dashboard {
            position: absolute;
            bottom: 20px; right: 20px;
            text-align: right;
            color: white;
            z-index: 10;
        }
        #speed { font-size: 60px; font-weight: bold; color: #fff; }
        #unit { font-size: 20px; color: #888; }
        #rpm-bar {
            width: 200px; height: 10px; background: #333;
            margin-top: 5px; border-radius: 5px; overflow: hidden;
        }
        #rpm-fill { width: 0%; height: 100%; background: linear-gradient(90deg, yellow, red); transition: width 0.1s; }

        /* Loading Screen */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: white; display: flex; 
            justify-content: center; align-items: center; z-index: 999;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>

<div id="loader"><h1>LOADING G-SQUARE ENGINE...</h1></div>

<div id="hud">
    <h1>G-SQUARE DRIFT</h1>
    <div class="controls">
        <p><b>WASD / Arrows:</b> Drive</p>
        <p><b>SPACE:</b> Handbrake (Drift)</p>
        <p><b>SHIFT:</b> Nitro Boost</p>
        <p><b>R:</b> Reset Car</p>
        <p><b>V:</b> Change Camera</p>
    </div>
</div>

<div id="dashboard">
    <div><span id="speed">0</span> <span id="unit">KM/H</span></div>
    <div id="rpm-bar"><div id="rpm-fill"></div></div>
</div>

<script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';

    // --- CONFIGURATION ---
    const CAR_COLOR = 0xffffff; // White Mehran
    const NEON_COLOR = 0x00ff00; // Green Underglow
    
    // --- SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);
    scene.fog = new THREE.FogExp2(0x050505, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- PHYSICS WORLD ---
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);
    world.broadphase = new CANNON.SAPBroadphase(world);
    
    // Physics Materials
    const groundMat = new CANNON.Material();
    const wheelMat = new CANNON.Material();
    const wheelGroundContact = new CANNON.ContactMaterial(wheelMat, groundMat, {
        friction: 0.3, // Low friction for drift
        restitution: 0,
        contactEquationStiffness: 1000
    });
    world.addContactMaterial(wheelGroundContact);

    // --- CITY GENERATION (G-Square Style) ---
    function createCity() {
        // 1. The Floor (Asphalt)
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMeshMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
        const groundMesh = new THREE.Mesh(groundGeo, groundMeshMat);
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        // Physics Floor
        const groundBody = new CANNON.Body({ mass: 0, material: groundMat }); // Static
        groundBody.addShape(new CANNON.Plane());
        groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(groundBody);

        // 2. Buildings & Street Lights
        const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
        const buildingMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
        const windowMat = new THREE.MeshBasicMaterial({ color: 0xffffaa }); // Lit windows

        for (let i = 0; i < 60; i++) {
            // Random buildings avoiding the center (Road area)
            let x = (Math.random() - 0.5) * 400;
            let z = (Math.random() - 0.5) * 400;
            
            if (Math.abs(x) < 20 && Math.abs(z) < 20) continue; // Clear spawn area

            let h = 10 + Math.random() * 40;
            let w = 10 + Math.random() * 15;
            let d = 10 + Math.random() * 15;

            const building = new THREE.Mesh(buildingGeo, buildingMat);
            building.position.set(x, h/2, z);
            building.scale.set(w, h, d);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);

            // Add collision for buildings
            const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
            const body = new CANNON.Body({ mass: 0 });
            body.position.set(x, h/2, z);
            body.addShape(shape);
            world.addBody(body);
        }

        // 3. Street Lights
        const lightGeo = new THREE.CylinderGeometry(0.2, 0.2, 8);
        const lightMat = new THREE.MeshBasicMaterial({ color: 0x555555 });
        
        for(let x = -100; x <= 100; x+=40) {
             // Simple poles
             const pole = new THREE.Mesh(lightGeo, lightMat);
             pole.position.set(x, 4, 25);
             scene.add(pole);

             const spotLight = new THREE.SpotLight(0xffaa00, 100);
             spotLight.position.set(x, 8, 25);
             spotLight.angle = Math.PI / 4;
             spotLight.penumbra = 0.5;
             spotLight.target.position.set(x, 0, 25);
             scene.add(spotLight);
             scene.add(spotLight.target);
        }
    }
    createCity();

    // --- CAR SETUP (Procedural "Mehran") ---
    function createCar() {
        const chassisShape = new CANNON.Box(new CANNON.Vec3(1, 0.5, 1.8));
        const chassisBody = new CANNON.Body({ mass: 150 });
        chassisBody.addShape(chassisShape, new CANNON.Vec3(0, 0, 0)); // Main body
        chassisBody.position.set(0, 2, 0);
        chassisBody.angularDamping = 0.5;

        // Visual Car Group
        const carMesh = new THREE.Group();

        // Body (Lower)
        const bodyGeo = new THREE.BoxGeometry(2, 0.8, 3.8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: CAR_COLOR, metalness: 0.3, roughness: 0.2 });
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
        bodyMesh.position.y = -0.1;
        carMesh.add(bodyMesh);

        // Cabin (Upper - Hatchback Style)
        const cabinGeo = new THREE.BoxGeometry(1.9, 0.7, 2.2);
        const cabinMesh = new THREE.Mesh(cabinGeo, bodyMat);
        cabinMesh.position.set(0, 0.65, -0.2);
        carMesh.add(cabinMesh);

        // Windshield (Black)
        const glassGeo = new THREE.BoxGeometry(1.92, 0.6, 1.5);
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.0 });
        const glassMesh = new THREE.Mesh(glassGeo, glassMat);
        glassMesh.position.set(0, 0.65, -0.1);
        carMesh.add(glassMesh);

        // Headlights
        const lightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
        const headLightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2 });
        
        const hlL = new THREE.Mesh(lightGeo, headLightMat);
        hlL.position.set(0.6, 0, 1.91);
        carMesh.add(hlL);

        const hlR = new THREE.Mesh(lightGeo, headLightMat);
        hlR.position.set(-0.6, 0, 1.91);
        carMesh.add(hlR);

        // Real Spotlights for night driving
        const carLight = new THREE.SpotLight(0xffffff, 50);
        carLight.position.set(0, 1, 1);
        carLight.target.position.set(0, 0, 10);
        carLight.angle = 0.5;
        carLight.penumbra = 0.3;
        carLight.castShadow = true;
        carMesh.add(carLight);
        carMesh.add(carLight.target); // Important to add target to hierarchy

        // Tail lights
        const tailLightMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2 });
        const tlL = new THREE.Mesh(lightGeo, tailLightMat);
        tlL.position.set(0.6, 0, -1.91);
        carMesh.add(tlL);
        const tlR = new THREE.Mesh(lightGeo, tailLightMat);
        tlR.position.set(-0.6, 0, -1.91);
        carMesh.add(tlR);

        scene.add(carMesh);

        // Vehicle Physics Setup
        const vehicle = new CANNON.RaycastVehicle({
            chassisBody: chassisBody,
            indexRightAxis: 0,
            indexUpAxis: 1,
            indexForwardAxis: 2
        });

        const wheelOptions = {
            radius: 0.35,
            directionLocal: new CANNON.Vec3(0, -1, 0),
            suspensionStiffness: 35,
            suspensionRestLength: 0.3,
            frictionSlip: 1.2, // Drift factor
            dampingRelaxation: 2.3,
            dampingCompression: 4.4,
            maxSuspensionForce: 100000,
            rollInfluence: 0.01,
            axleLocal: new CANNON.Vec3(1, 0, 0),
            chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 0),
            maxSuspensionTravel: 0.3,
            customSlidingRotationalSpeed: -30,
            useCustomSlidingRotationalSpeed: true
        };

        // Add Wheels
        const axleWidth = 0.8;
        const wheelY = -0.5;
        const frontZ = 1.2;
        const backZ = -1.2;

        vehicle.addWheel({ ...wheelOptions, chassisConnectionPointLocal: new CANNON.Vec3(axleWidth, wheelY, frontZ) });
        vehicle.addWheel({ ...wheelOptions, chassisConnectionPointLocal: new CANNON.Vec3(-axleWidth, wheelY, frontZ) });
        vehicle.addWheel({ ...wheelOptions, chassisConnectionPointLocal: new CANNON.Vec3(axleWidth, wheelY, backZ) });
        vehicle.addWheel({ ...wheelOptions, chassisConnectionPointLocal: new CANNON.Vec3(-axleWidth, wheelY, backZ) });

        vehicle.addToWorld(world);

        // Visual Wheels
        const wheelMeshes = [];
        const wGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 24);
        const wMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const rimGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.26, 8);
        const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });

        for (let i = 0; i < 4; i++) {
            const wMesh = new THREE.Group();
            const tire = new THREE.Mesh(wGeo, wMat);
            tire.rotation.z = Math.PI / 2;
            const rim = new THREE.Mesh(rimGeo, rimMat);
            rim.rotation.z = Math.PI / 2;
            wMesh.add(tire);
            wMesh.add(rim);
            
            scene.add(wMesh);
            wheelMeshes.push(wMesh);
        }

        return { vehicle, chassisBody, carMesh, wheelMeshes };
    }

    const { vehicle, chassisBody, carMesh, wheelMeshes } = createCar();

    // --- PARTICLE SYSTEM (SMOKE) ---
    const particles = [];
    const smokeGeo = new THREE.PlaneGeometry(1, 1);
    const smokeMat = new THREE.MeshBasicMaterial({ 
        color: 0xaaaaaa, transparent: true, opacity: 0.5, depthWrite: false 
    });

    function createSmoke(pos) {
        if(particles.length > 50) return; // Limit particles
        const p = new THREE.Mesh(smokeGeo, smokeMat);
        p.position.copy(pos);
        p.position.y = 0.2;
        p.rotation.z = Math.random() * Math.PI;
        p.life = 1.0;
        scene.add(p);
        particles.push(p);
    }

    // --- INPUT HANDLING ---
    const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };

    document.addEventListener('keydown', (e) => {
        if(e.key === ' ' || e.code === 'Space') keys.space = true;
        if(e.key === 'Shift') keys.shift = true;
        if(e.key.toLowerCase() === 'r') resetCar();
        if(e.key.toLowerCase() === 'v') toggleCamera();
        keys[e.key.toLowerCase()] = true;
    });
    
    document.addEventListener('keyup', (e) => {
        if(e.key === ' ' || e.code === 'Space') keys.space = false;
        if(e.key === 'Shift') keys.shift = false;
        keys[e.key.toLowerCase()] = false;
    });

    function resetCar() {
        chassisBody.position.set(0, 2, 0);
        chassisBody.quaternion.set(0, 0, 0, 1);
        chassisBody.velocity.set(0, 0, 0);
        chassisBody.angularVelocity.set(0, 0, 0);
    }

    let camMode = 0; // 0: Chase, 1: Top, 2: Far
    function toggleCamera() {
        camMode = (camMode + 1) % 3;
    }

    // --- MAIN GAME LOOP ---
    const timeStep = 1 / 60;
    const speedometer = document.getElementById('speed');
    const rpmFill = document.getElementById('rpm-fill');
    document.getElementById('loader').style.display = 'none';

    function animate() {
        requestAnimationFrame(animate);

        // 1. Physics Engine
        const maxSteer = 0.6;
        const engineForce = keys.shift ? 2500 : 1200; // Nitro boost
        const brakeForce = 50;
        const handBrakeForce = 1000;

        // Drive Logic (Rear Wheel Drive)
        let force = 0;
        if (keys.w || keys.arrowup) force = -engineForce;
        if (keys.s || keys.arrowdown) force = engineForce / 1.5;

        vehicle.applyEngineForce(force, 2);
        vehicle.applyEngineForce(force, 3);

        // Steering
        let steer = 0;
        if (keys.a || keys.arrowleft) steer = maxSteer;
        if (keys.d || keys.arrowright) steer = -maxSteer;
        
        vehicle.setSteeringValue(steer, 0);
        vehicle.setSteeringValue(steer, 1);

        // Brakes & Drift
        if (keys.space) {
            vehicle.setBrake(handBrakeForce, 2);
            vehicle.setBrake(handBrakeForce, 3);
            // Create smoke if moving fast
            if(chassisBody.velocity.length() > 5) {
                createSmoke(wheelMeshes[2].position);
                createSmoke(wheelMeshes[3].position);
            }
        } else {
            vehicle.setBrake(0, 2);
            vehicle.setBrake(0, 3);
        }

        world.step(timeStep);

        // 2. Sync Visuals
        carMesh.position.copy(chassisBody.position);
        carMesh.quaternion.copy(chassisBody.quaternion);
        // Correct car body offset visually
        carMesh.translateY(-0.5); 

        for (let i = 0; i < vehicle.wheelInfos.length; i++) {
            vehicle.updateWheelTransform(i);
            const t = vehicle.wheelInfos[i].worldTransform;
            wheelMeshes[i].position.copy(t.position);
            wheelMeshes[i].quaternion.copy(t.quaternion);
        }

        // 3. Camera System
        let offset;
        if(camMode === 0) offset = new THREE.Vector3(0, 4, 8); // Chase
        else if(camMode === 1) offset = new THREE.Vector3(0, 20, 10); // Top
        else offset = new THREE.Vector3(0, 6, 15); // Far

        // Convert local offset to world
        const cameraTarget = offset.applyMatrix4(carMesh.matrixWorld);
        camera.position.lerp(cameraTarget, 0.1); // Smooth follow
        camera.lookAt(carMesh.position);

        // 4. Update Particles
        for(let i = particles.length - 1; i >= 0; i--){
            let p = particles[i];
            p.position.y += 0.05;
            p.scale.x += 0.05;
            p.scale.y += 0.05;
            p.material.opacity -= 0.02;
            if(p.material.opacity <= 0) {
                scene.remove(p);
                particles.splice(i, 1);
            }
        }

        // 5. Dashboard Update
        const speedKmH = Math.round(chassisBody.velocity.length() * 3.6);
        speedometer.innerText = speedKmH;
        
        // Fake RPM logic
        let rpm = (speedKmH / 150) * 100;
        if(keys.w) rpm += 10;
        if(rpm > 100) rpm = 100 + Math.random() * 5; // Needle wobble
        rpmFill.style.width = rpm + '%';
        if(rpm > 80) rpmFill.style.background = 'red';
        else rpmFill.style.background = 'linear-gradient(90deg, yellow, red)';

        renderer.render(scene, camera);
    }

    // Handle Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>

</body>
</html>
