<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- Apple Aesthetic Theme --- */
        :root {
            --bg-color: #f5f5f7;
            --sidebar-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-light: #86868b;
            --accent: #0071e3;
            --border: #d2d2d7;
            --header-bg: #fbfbfd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--border);
        }

        .nav-item {
            padding: 14px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .nav-item:hover { background-color: #f5f5f7; }

        .nav-item.active {
            background-color: #0071e3;
            color: #fff;
        }

        /* --- Main Content (Split View) --- */
        .main-content {
            flex: 1;
            display: flex;
            background: #fff;
            overflow: hidden;
        }

        /* Left: Phone Image */
        .image-section {
            width: 40%;
            background-color: #fafafa;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .phone-img {
            max-height: 60vh;
            max-width: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 35px rgba(0,0,0,0.2));
            transition: transform 0.3s ease;
        }
        
        .phone-name-display {
            margin-top: 30px;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
        }

        /* Right: Detailed Table */
        .details-section {
            width: 60%;
            overflow-y: auto;
            padding: 0;
        }

        .specs-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px; /* Slightly smaller for dense data */
        }

        .specs-table th {
            text-align: left;
            padding: 12px 20px;
            background-color: #f5f5f7;
            color: var(--text-main);
            font-weight: 700;
            text-transform: uppercase;
            border-top: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
        }

        .specs-table td {
            padding: 12px 20px;
            color: #333;
            line-height: 1.6;
            vertical-align: top;
        }

        .category-row {
            background-color: #fbfbfd;
        }

        .label-cell {
            width: 30%;
            font-weight: 600;
            color: var(--text-light);
            border-right: 1px solid #f0f0f0;
        }

        .value-cell {
            width: 70%;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .sidebar { display: none; }
            .main-content { flex-direction: column; overflow-y: auto; }
            .image-section { width: 100%; height: 400px; border-right: none; border-bottom: 1px solid var(--border); }
            .details-section { width: 100%; }
        }
    </style>
</head>
<body>

             {

        // --- RENDER LOGIC ---

        const sidebar = document.getElementById('sidebar');
        const specsTable = document.getElementById('specs-table');
        const mainImg = document.getElementById('main-img');
        const mainTitle = document.getElementById('main-title');

        // 1. Create Sidebar
        phonesData.forEach((phone, index) => {
            const btn = document.createElement('div');
            btn.className = 'nav-item';
            btn.innerText = phone.model;
            btn.onclick = () => loadPhone(index, btn);
            sidebar.appendChild(btn);
        });

        // 2. Load Data Function
        function loadPhone(index, clickedBtn) {
            // Update Active State
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            if(clickedBtn) clickedBtn.classList.add('active');
            else sidebar.children[1].classList.add('active'); // Default first item

            const data = phonesData[index];

            // Update Image Area
            mainImg.src = data.image;
            mainTitle.innerText = data.model;
            
            // Animation Reset
            mainImg.style.opacity = 0;
            mainImg.style.transform = "translateY(10px)";
            setTimeout(() => {
                mainImg.style.opacity = 1;
                mainImg.style.transform = "translateY(0)";
            }, 50);

            // Update Table
            specsTable.innerHTML = ''; // Clear existing
            
            for (const [category, details] of Object.entries(data.specs)) {
                // Create Category Header
                const catHeader = document.createElement('tr');
                catHeader.innerHTML = `<th colspan="2">${category}</th>`;
                specsTable.appendChild(catHeader);

                // Create Detail Rows
                for (const [key, value] of Object.entries(details)) {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="label-cell">${key}</td>
                        <td class="value-cell">${value}</td>
                    `;
                    specsTable.appendChild(row);
                }
            }
        }

        // Initialize First Phone (iPhone 17 Pro Max for demo)
        loadPhone(0, sidebar.children[1]);

</html>
