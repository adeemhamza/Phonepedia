<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pakistani Street Drift - Ultimate</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        
        /* UI Design */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        .score-box {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            text-align: center; color: #fff; text-shadow: 0 0 10px #ff0055;
        }
        #score-val { font-size: 50px; font-weight: bold; font-style: italic; }
        #score-label { font-size: 20px; letter-spacing: 5px; color: #ff0055; }

        .controls-info {
            position: absolute; top: 20px; left: 20px;
            color: rgba(255,255,255,0.7); font-size: 14px;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
        }

        /* Speedometer */
        .dashboard {
            position: absolute; bottom: 30px; right: 30px;
            text-align: right; color: white;
        }
        .speed { font-size: 80px; font-weight: 900; line-height: 0.8; }
        .unit { font-size: 20px; color: #ffcc00; }
        
        .nitro-bar {
            width: 200px; height: 10px; background: #333; margin-top: 10px;
            border: 1px solid #555; transform: skewX(-20deg);
        }
        #nitro-fill {
            width: 100%; height: 100%; background: #00ffff;
            box-shadow: 0 0 10px #00ffff; transition: width 0.1s;
        }

    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>

    <div id="hud">
        <div class="controls-info">
            <b>WASD</b> to Drive<br>
            <b>SPACE</b> to Drift (Handbrake)<br>
            <b>SHIFT</b> for Nitro<br>
            <b>V</b> Change Camera<br>
            <b>R</b> Reset Car
        </div>
        <div class="score-box">
            <div id="score-val">0</div>
            <div id="score-label">DRIFT POINTS</div>
        </div>
        <div class="dashboard">
            <div class="speed" id="speed-disp">0</div>
            <div class="unit">KM/H</div>
            <div class="nitro-bar"><div id="nitro-fill"></div></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';

        // --- GAME VARIABLES ---
        let score = 0;
        let nitro = 100;
        let camMode = 0;
        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };

        // --- 1. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.012);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambLight);
        const moonLight = new THREE.DirectionalLight(0xaaccff, 1);
        moonLight.position.set(50, 100, 50);
        moonLight.castShadow = true;
        scene.add(moonLight);

        // Physics World
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        world.broadphase = new CANNON.SAPBroadphase(world);

        // Materials
        const groundMat = new CANNON.Material();
        const wheelMat = new CANNON.Material();
        const wheelGroundContact = new CANNON.ContactMaterial(wheelMat, groundMat, {
            friction: 0.3, restitution: 0, contactEquationStiffness: 1000
        });
        world.addContactMaterial(wheelGroundContact);

        // --- 2. ENVIRONMENT (City) ---
        // Floor
        const floorGeo = new THREE.PlaneGeometry(500, 500);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const floorBody = new CANNON.Body({ mass: 0, material: groundMat });
        floorBody.addShape(new CANNON.Plane());
        floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(floorBody);

        // Buildings Generator
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const boxMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
        const winMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        
        for(let i=0; i<80; i++){
            const w = 10 + Math.random()*20;
            const h = 20 + Math.random()*50;
            const d = 10 + Math.random()*20;
            const x = (Math.random()-0.5) * 400;
            const z = (Math.random()-0.5) * 400;

            if(Math.abs(x) < 30 && Math.abs(z) < 30) continue; // Keep center clear

            const b = new THREE.Mesh(boxGeo, boxMat);
            b.position.set(x, h/2, z);
            b.scale.set(w, h, d);
            b.castShadow = true;
            b.receiveShadow = true;
            scene.add(b);

            // Add Windows
            if(Math.random() > 0.5){
                const win = new THREE.Mesh(boxGeo, winMat);
                win.position.set(x, h/2, z);
                win.scale.set(w+0.1, h*0.8, d+0.1); // Slightly larger
                // Simple logic to make it look like windows
                // (In a real game we use textures, here we use geometry for simplicity)
            }

            // Physics for buildings
            const body = new CANNON.Body({ mass: 0 });
            body.addShape(new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)));
            body.position.set(x, h/2, z);
            world.addBody(body);
        }

        // --- 3. THE CAR (Mehran Style) ---
        const chassisShape = new CANNON.Box(new CANNON.Vec3(1, 0.5, 1.8));
        const chassisBody = new CANNON.Body({ mass: 150 });
        chassisBody.addShape(chassisShape, new CANNON.Vec3(0, -0.2, 0)); // Lower center of gravity
        chassisBody.position.set(0, 2, 0);
        chassisBody.angularDamping = 0.5;

        const vehicle = new CANNON.RaycastVehicle({
            chassisBody: chassisBody,
            indexRightAxis: 0, indexUpAxis: 1, indexForwardAxis: 2
        });

        // Wheel Config
        const wheelOptions = {
            radius: 0.35, directionLocal: new CANNON.Vec3(0, -1, 0),
            suspensionStiffness: 40, suspensionRestLength: 0.3,
            frictionSlip: 1.5, dampingRelaxation: 2.3, dampingCompression: 4.4,
            maxSuspensionForce: 100000, rollInfluence: 0.01,
            axleLocal: new CANNON.Vec3(1, 0, 0),
            chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 0),
            maxSuspensionTravel: 0.3,
            customSlidingRotationalSpeed: -30, useCustomSlidingRotationalSpeed: true
        };

        // Add Wheels
        vehicle.addWheel({ ...wheelOptions, chassisConnectionPointLocal: new CANNON.Vec3(0.8, -0.2, 1.2) });
        vehicle.addWheel({ ...wheelOptions, chassisConnectionPointLocal: new CANNON.Vec3(-0.8, -0.2, 1.2) });
        vehicle.addWheel({ ...wheelOptions, chassisConnectionPointLocal: new CANNON.Vec3(0.8, -0.2, -1.2) });
        vehicle.addWheel({ ...wheelOptions, chassisConnectionPointLocal: new CANNON.Vec3(-0.8, -0.2, -1.2) });

        vehicle.addToWorld(world);

        // --- CAR VISUALS ---
        const carGroup = new THREE.Group();
        
        // Body White
        const bodyGeo = new THREE.BoxGeometry(1.8, 0.7, 3.8);
        const bodyMatCar = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.5 });
        const bodyMesh = new THREE.Mesh(bodyGeo, bodyMatCar);
        bodyMesh.position.y = 0.2;
        carGroup.add(bodyMesh);

        // Roof
        const roofGeo = new THREE.BoxGeometry(1.6, 0.6, 2.2);
        const roofMesh = new THREE.Mesh(roofGeo, bodyMatCar);
        roofMesh.position.set(0, 0.8, -0.3);
        carGroup.add(roofMesh);

        // Windows
        const glassGeo = new THREE.BoxGeometry(1.65, 0.55, 2.1);
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const glassMesh = new THREE.Mesh(glassGeo, glassMat);
        glassMesh.position.set(0, 0.8, -0.3);
        carGroup.add(glassMesh);

        // Headlights
        const hlGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
        const hlMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 5 });
        const hlL = new THREE.Mesh(hlGeo, hlMat); hlL.position.set(0.6, 0.3, 1.95); carGroup.add(hlL);
        const hlR = new THREE.Mesh(hlGeo, hlMat); hlR.position.set(-0.6, 0.3, 1.95); carGroup.add(hlR);
        
        // Spotlights
        const spotL = new THREE.SpotLight(0xffffff, 100);
        spotL.position.set(0, 1, 2);
        spotL.target.position.set(0, 0, 20);
        spotL.angle = 0.6; spotL.penumbra = 0.5; spotL.castShadow = true;
        carGroup.add(spotL); carGroup.add(spotL.target);

        // Taillights
        const tlMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 3 });
        const tlL = new THREE.Mesh(hlGeo, tlMat); tlL.position.set(0.6, 0.3, -1.95); carGroup.add(tlL);
        const tlR = new THREE.Mesh(hlGeo, tlMat); tlR.position.set(-0.6, 0.3, -1.95); carGroup.add(tlR);

        // Exhaust Flame
        const flameGeo = new THREE.ConeGeometry(0.1, 0.5, 8);
        const flameMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const flame = new THREE.Mesh(flameGeo, flameMat);
        flame.position.set(0.5, -0.2, -2.0);
        flame.rotation.x = -Math.PI / 2;
        flame.visible = false;
        carGroup.add(flame);

        scene.add(carGroup);

        // Wheels Visuals
        const wheelMeshes = [];
        const wGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 24);
        const wMatVis = new THREE.MeshStandardMaterial({ color: 0x222222 });
        for(let i=0; i<4; i++){
            const m = new THREE.Mesh(wGeo, wMatVis);
            m.rotation.z = Math.PI/2;
            scene.add(m);
            wheelMeshes.push(m);
        }

        // --- 4. PARTICLES (Smoke) ---
        const particles = [];
        const smokeGeo = new THREE.PlaneGeometry(1,1);
        const smokeMatVis = new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
        
        function createSmoke(pos) {
            const p = new THREE.Mesh(smokeGeo, smokeMatVis);
            p.position.copy(pos);
            p.position.y = 0.1;
            p.rotation.x = -Math.PI/2;
            p.life = 1.0;
            scene.add(p);
            particles.push(p);
        }

        // --- CONTROLS ---
        document.addEventListener('keydown', (e) => {
            if(e.key === ' ') keys.space = true;
            if(e.key === 'Shift') keys.shift = true;
            if(keys[e.key.toLowerCase()] !== undefined) keys[e.key.toLowerCase()] = true;
            if(e.key.toLowerCase() === 'v') camMode = (camMode + 1) % 2;
            if(e.key.toLowerCase() === 'r') {
                chassisBody.position.set(0, 2, 0);
                chassisBody.quaternion.set(0,0,0,1);
                chassisBody.velocity.set(0,0,0);
                chassisBody.angularVelocity.set(0,0,0);
                score = 0;
            }
        });
        document.addEventListener('keyup', (e) => {
            if(e.key === ' ') keys.space = false;
            if(e.key === 'Shift') keys.shift = false;
            if(keys[e.key.toLowerCase()] !== undefined) keys[e.key.toLowerCase()] = false;
        });

        // --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            world.step(1/60);

            // Car Physics
            const maxSteer = 0.5;
            let engineForce = 1200;
            let brakeForce = 0;

            // Nitro Logic
            if(keys.shift && nitro > 0) {
                engineForce = 3000;
                nitro -= 0.5;
                flame.visible = true;
                // Random flicker
                flame.scale.set(1, 1 + Math.random(), 1);
            } else {
                if(nitro < 100) nitro += 0.1; // Recharge
                flame.visible = false;
            }
            document.getElementById('nitro-fill').style.width = nitro + '%';

            // Movement
            let force = 0;
            if(keys.w) force = -engineForce;
            if(keys.s) force = engineForce / 2;

            vehicle.applyEngineForce(force, 2);
            vehicle.applyEngineForce(force, 3);

            let steer = 0;
            if(keys.a) steer = maxSteer;
            if(keys.d) steer = -maxSteer;
            vehicle.setSteeringValue(steer, 0);
            vehicle.setSteeringValue(steer, 1);

            // Drift Logic
            if(keys.space) {
                vehicle.setBrake(50, 2); // Front weak brake
                vehicle.setBrake(50, 3); 
                // Sliding logic handled by physics friction, 
                // but we add smoke here
                if(Math.abs(chassisBody.velocity.length()) > 5) {
                    createSmoke(wheelMeshes[2].position);
                    createSmoke(wheelMeshes[3].position);
                    score += 1;
                    document.getElementById('score-val').innerText = score;
                }
            } else {
                vehicle.setBrake(0, 2);
                vehicle.setBrake(0, 3);
            }

            // Sync Visuals
            carGroup.position.copy(chassisBody.position);
            carGroup.quaternion.copy(chassisBody.quaternion);
            carGroup.translateY(-0.5); // Adjustment

            for(let i=0; i<4; i++){
                vehicle.updateWheelTransform(i);
                wheelMeshes[i].position.copy(vehicle.wheelInfos[i].worldTransform.position);
                wheelMeshes[i].quaternion.copy(vehicle.wheelInfos[i].worldTransform.quaternion);
            }

            // Particles Animation
            for(let i=particles.length-1; i>=0; i--){
                particles[i].scale.multiplyScalar(1.05);
                particles[i].material.opacity -= 0.03;
                if(particles[i].material.opacity <= 0){
                    scene.remove(particles[i]);
                    particles.splice(i,1);
                }
            }

            // Camera
            const relativeOffset = camMode === 0 ? new THREE.Vector3(0, 5, 10) : new THREE.Vector3(0, 2, 0.5); // Chase vs Bonnet
            const camPos = relativeOffset.applyMatrix4(carGroup.matrixWorld);
            camera.position.lerp(camPos, 0.1);
            
            if(camMode === 0) {
                camera.lookAt(carGroup.position);
            } else {
                // Bonnet view look ahead
                const lookTarget = new THREE.Vector3(0, 0, -20).applyMatrix4(carGroup.matrixWorld);
                camera.lookAt(lookTarget);
            }

            // Speedometer
            document.getElementById('speed-disp').innerText = Math.round(chassisBody.velocity.length() * 3.6);

            renderer.render(scene, camera);
        }

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
